<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام استعلام الطالب</title>

<style>

/* =========================
   خلفية — أزرق نيون
========================= */
body {
    font-family: 'Cairo', sans-serif;
    direction: rtl;
    background: linear-gradient(135deg, #00e1ff, #007bff);
    background-size: 300% 300%;
    animation: neonBg 8s infinite alternate ease-in-out;
    margin: 0;
    padding-bottom: 120px;
}
@keyframes neonBg { 0%{background-position:0% 50%} 100%{background-position:100% 50%} }

/* =========================
   Splash Screen
========================= */
#splash {
    position: fixed;
    inset: 0;
    background: white;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    animation: splashFadeOut 3.4s forwards;
}
@keyframes splashFadeOut { 0%,70%{opacity:1;} 100%{opacity:0;visibility:hidden;} }
.splash-title { font-size: 30px; font-weight:bold; color:#007bff; }

/* =========================
   Header
========================= */
header {
    text-align: center;
    padding: 20px;
    font-size: 22px;
    color: white;
    font-weight: bold;
    opacity: 0;
    animation: fadeIn 1.4s 3.2s forwards;
}
@keyframes fadeIn { to { opacity: 1; } }

/* =========================
   Login Box
========================= */
.login-box {
    width: 85%;
    max-width: 340px;
    margin: 140px auto 0;
    text-align: center;
}
.login-box input,
.login-box button {
    width: 100%;
    padding: 13px;
    font-size: 17px;
    border-radius: 14px;
    border: none;
    margin-top: 14px;
}
.login-box input {
    background: white;
    color: #0060c9;
    font-weight: bold;
}
.login-box button {
    background: linear-gradient(135deg, #00b8ff, #006aff);
    color: white;
    font-weight: bold;
}
.error { color: yellow; font-weight: bold; }

/* =========================
   Pages
========================= */
.page { display: none; }

.section {
    padding: 15px;
    margin: 20px;
    border-radius: 18px;
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(16px);
    color: #004a99;
    font-weight: bold;
}

/* =========================
   Tables (الملف الشخصي)
========================= */
table { width: 100%; border-collapse: collapse; }
td, th {
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.4);
}
.table-input {
    width: 100%;
    padding: 10px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.75);
    color: #004a99;
}
.table-input.hasDate {
    color: #002855;
    font-weight: bold;
}

/* =========================
   Action Buttons (الملف الشخصي)
========================= */
.profile-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}
.logout-btn, .save-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-weight: bold;
    color: white;
}
.logout-btn { background:#ff1744; }
.save-btn { background:#ffd600; color:black; }

/* =========================
   Bottom Navigation
========================= */
#bottomBar {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 92%;
    height: 70px;
    display: none;
    justify-content: space-around;
    align-items: center;
    border-radius: 30px;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow:0 5px 20px rgba(0,0,0,0.25);
    transition:0.8s;
    color:#004a99;
}
#bottomBar.show-bar { transform: translateX(-50%) translateY(0); }

.nav-item { cursor:pointer; opacity:.7; font-weight:bold; position:relative; }
.nav-item:hover { opacity:1; }

.burst {
    position:absolute;
    width:12px;
    height:12px;
    background:white;
    border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    animation:burstAnim .5s forwards;
}
@keyframes burstAnim {
    0%{transform:translate(-50%,-50%) scale(0);opacity:1;}
    100%{transform:translate(-50%,-50%) scale(15);opacity:0;}
}

/* =========================
   بطاقات الدرجات
========================= */
.grade-card {
    background: rgba(255,255,255,0.75);
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
}

.grade-title {
    font-size: 19px;
    margin-bottom: 10px;
    color: #003f7d;
    border-bottom: 2px solid #006aff;
    padding-bottom: 6px;
}

.grade-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 14px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
}
.grade-row:last-child {
    border-bottom: none;
}

.objection-btn {
    width: 100%;
    padding: 10px;
    margin-top: 12px;
    background: #00c853;
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
}

/* بطاقة الملخص أسفل المواد */
.grades-info-card {
    margin-top: 20px;
    background: rgba(255,255,255,0.85);
    padding: 14px;
    border-radius: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.16);
    font-size: 14px;
    color: #003f7d;
}
.grades-info-card p {
    margin: 4px 0;
}

</style>
</head>

<body>

<!-- Splash -->
<div id="splash">
    <div class="splash-title">قسم الحوكمة</div>
    <div class="splash-sub">ثانوية التحدي الأهلية</div>
    <div class="splash-year">العام الدراسي 2025 - 2026</div>
</div>

<header>📘 نظام استعلام الطالب</header>

<!-- Login -->
<div class="login-box" id="loginBox">
    <input id="studentCode" placeholder="أدخل كود الطالب">
    <button onclick="searchStudent()">تسجيل الدخول</button>
    <div id="output"></div>
</div>

<!-- Pages -->
<div id="profilePage" class="page section"></div>
<div id="gradesPage" class="page section">لا توجد درجات حالياً</div>
<div id="notifyPage" class="page section">لا توجد تبليغات حالياً</div>
<div id="chatPage" class="page section">لا توجد رسائل حالياً</div>

<!-- Bottom Bar -->
<div id="bottomBar">
    <div class="nav-item" onclick="showPage('profilePage', this)">الملف الشخصي</div>
    <div class="nav-item" onclick="showPage('gradesPage', this)">الدرجات</div>
    <div class="nav-item" onclick="showPage('notifyPage', this)">التبليغات</div>
    <div class="nav-item" onclick="showPage('chatPage', this)">الدردشة</div>
</div>

<script>

/* رابط API */
const API_URL = "https://script.google.com/macros/s/AKfycbxn5f4smL2SYZ8BkFKdOZzRoZdugC4fHycSO7VEJi4JLAD8X1-pOCZneYLqGL3GuVFf/exec";

/* =========================
   دالة إصلاح أي تاريخ قادم من الشيت
========================= */
function fixDate(dateStr) {
    if (!dateStr) return "";

    // تحويل أرقام عربية إلى إنجليزية إن وجدت
    dateStr = dateStr.replace(/[٠-٩]/g, d => "0123456789"["٠١٢٣٤٥٦٧٨٩".indexOf(d)]);

    let parsed = Date.parse(dateStr);
    if (!isNaN(parsed)) {
        let d = new Date(parsed);
        let yyyy = d.getFullYear();
        let mm = String(d.getMonth()+1).padStart(2,'0');
        let dd = String(d.getDate()).padStart(2,'0');
        return `${yyyy}-${mm}-${dd}`;
    }

    if (dateStr.includes("/") || dateStr.includes("-")) {
        let p = dateStr.split(/[-\/]/);
        if (p.length === 3) {
            return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
        }
    }

    return "";
}

/* =========================
   تحديث حالة الطالب: تسجيل/خروج
========================= */
async function updateState(code, state) {
    await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
            action: "update_state",
            code: code,
            state: state
        })
    });
}

/* =========================
   تسجيل الدخول
========================= */
async function searchStudent(saveSession = true) {

    let code = document.getElementById("studentCode").value.trim();
    let output = document.getElementById("output");

    if (!code) {
        output.innerHTML = "<p class='error'>⚠️ يرجى إدخال الكود</p>";
        return;
    }

    output.innerHTML = `<p style="color:white">⏳ جاري التحميل...</p>`;

    try {
        let res = await fetch(`${API_URL}?code=${code}`);
        let data = await res.json();

        if (data.status !== "success") {
            output.innerHTML = `<p class='error'>❌ ${data.data}</p>`;
            return;
        }

        let student = data.data;

        if (saveSession) {
            localStorage.setItem("loggedIn", "true");
            localStorage.setItem("studentCode", code);

            /* تسجيل الحالة */
            updateState(code, "تم التسجيل");
        }

        document.getElementById("loginBox").style.display = "none";
        document.getElementById("bottomBar").style.display = "flex";
        document.getElementById("bottomBar").classList.add("show-bar");

        loadProfile(student);
        loadGrades(student);   // ⬅ تحميل صفحة الدرجات أيضاً

    } catch (err) {
        output.innerHTML = `<p class="error">❌ خطأ في الاتصال</p>`;
    }
}

/* =========================
   الملف الشخصي
========================= */
function loadProfile(student) {

    const code = student["كود الطالب"] || "";

    document.getElementById("profilePage").innerHTML = `

    <div class="profile-actions">
        <button onclick="logout()" class="logout-btn">🔐 خروج</button>
        <button onclick="saveChanges('${code}')" class="save-btn">💾 حفظ</button>
    </div>

    <h3>📄 الملف الشخصي</h3>

    <table>

      <tr><th>ID</th><td>${student["id"] || ""}</td></tr>

      <tr><th>اسم الطالب</th><td>${student["اسم الطالب"] || ""}</td></tr>

      <tr>
          <th>المواليد</th>
          <td>
              <input 
                  type="date" 
                  class="table-input" 
                  id="المواليد"
                  min="1960-01-01"
                  max="2027-12-31"
                  value="${ fixDate(student["المواليد"]) }"
                  onchange="this.classList.add('hasDate')"
              >
          </td>
      </tr>

      <tr><th>الصف</th><td>${student["الصف"] || ""}</td></tr>
      <tr><th>القاعة</th><td>${student["القاعة"] || ""}</td></tr>
      <tr><th>الجنس</th><td>${student["الجنس"] || ""}</td></tr>

      <tr><th>رقم ولي الأمر</th>
      <td><input class="table-input" id="رقم ولي الامر" value="${student["رقم ولي الامر"] || ""}"></td></tr>

      <tr><th>رقم الخط</th>
      <td><input class="table-input" id="رقم الخط" value="${student["رقم الخط"] || ""}"></td></tr>

      <tr><th>كود الطالب</th><td>${student["كود الطالب"] || ""}</td></tr>

      <tr><th>رقم الطالب</th>
      <td><input class="table-input" id="رقم الطالب" value="${student["رقم الطالب"] || ""}"></td></tr>

      <tr><th>الكتب</th><td>${student["الكتب"] || ""}</td></tr>

      <tr><th>العنوان</th>
      <td><input class="table-input" id="العنوان" value="${student["العنوان"] || ""}"></td></tr>

      <tr><th>اسم الأم</th>
      <td><input class="table-input" id="اسم الام" value="${student["اسم الام"] || ""}"></td></tr>

      <tr><th>المدرسة القادم منها</th>
      <td><input class="table-input" id="المدرسة القادم منها" value="${student["المدرسة القادم منها"] || ""}"></td></tr>

      <tr><th>المعدل</th><td>${student["المعدل في الصف السابق"] || ""}</td></tr>

      <tr><th>الملاحظات</th><td>${student["الملاحظات"] || ""}</td></tr>

      <tr><th>الرمز</th>
      <td><input class="table-input" id="الرمز" value="${student["الرمز"] || ""}"></td></tr>

    </table>
    `;

    showPage("profilePage");
}

/* =========================
   حفظ التعديلات
========================= */
async function saveChanges(code) {

    const data = {
        "المواليد": document.getElementById("المواليد").value,
        "رقم ولي الامر": document.getElementById("رقم ولي الامر").value,
        "رقم الخط": document.getElementById("رقم الخط").value,
        "رقم الطالب": document.getElementById("رقم الطالب").value,
        "العنوان": document.getElementById("العنوان").value,
        "اسم الام": document.getElementById("اسم الام").value,
        "المدرسة القادم منها": document.getElementById("المدرسة القادم منها").value,
        "الرمز": document.getElementById("الرمز").value
    };

    await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
            action: "update",
            code: code,
            data: data
        })
    });

    alert("✔ تم حفظ التعديلات");
}

/* =========================
   🔵 دالة تحديد عمود الاعتراض حسب المادة
========================= */
function getObjectionColumn(subject) {
    const map = {
        "الإسلامية": "الاعتراضات الاسلامية",
        "العربي": "الاعتراض عربي",
        "الانكليزي": "الاعتراض انكليزي",
        "الرياضيات": "الاعتراض رياضيات",
        "الكيمياء": "الاعتراض كيمياء",
        "الفيزياء": "الاعتراض فيزياء",
        "الاحياء": "الاعتراض احياء",
        "الاجتماعيات": "الاعتراض الاجتماعيات",
        "الحاسوب": "الاعتراض الحاسوب",
        "رياضة": "الاعتراض رياضة",
        "الفنية": "الاعتراض فنية",
        "السلوك": "الاعتراض السلوك"
    };
    return map[subject] || "";
}

/* =========================
   🔵 إرسال الاعتراض إلى الشيت
========================= */
async function sendObjection(code, column, subjectName) {

    if (!column) {
        alert("⚠ لا يوجد عمود اعتراض مرتبط بهذه المادة");
        return;
    }

    const message = `اعتراض على مادة ${subjectName}`;

    await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
            action: "update",
            code: code,
            data: { [column]: message }
        })
    });

    alert("✔ تم تسجيل اعتراضك على مادة " + subjectName);
}

/* =========================
   🔵 صفحة الدرجات
========================= */
function loadGrades(st) {

    const code = st["كود الطالب"] || "";

    let html = ``;

    // تعريف المواد والحقول لكل مادة
    const subjects = {
        "الإسلامية": [
            "اسلامية شهر 1","اسلامية شهر 2","اسلامية فصل 1","اسلامية نصف سنة",
            "اسلامية شهر 3","اسلامية شهر 4","اسلامية فصل 2","اسلامية الامتحان النهائي",
            "اسلامية السعي","اسلامية التقدير"
        ],
        "العربي": [
            "العربي شهر 1","العربي شهر 2","العربي فصل 1","العربي نصف سنة",
            "العربي شهر 3","العربي شهر 4","العربي فصل 2","العربي الامتحان النهائي",
            "العربي السعي","العربي التقدير"
        ],
        "الانكليزي": [
            "الانكليزي شهر 1","الانكليزي شهر 2","الانكليزي فصل 1","الانكليزي نصف سنة",
            "الانكليزي شهر 3","الانكليزي شهر 4","الانكليزي فصل 2","الانكليزي الامتحان النهائي",
            "الانكليزي السعي","الانكليزي التقدير"
        ],
        "الرياضيات": [
            "الرياضيات شهر 1","الرياضيات شهر 2","الرياضيات فصل 1","الرياضيات نصف سنة",
            "الرياضيات شهر 3","الرياضيات شهر 4","الرياضيات فصل 2","الرياضيات الامتحان النهائي",
            "الرياضيات السعي","الرياضيات التقدير"
        ],
        "الكيمياء": [
            "الكيمياء شهر 1","الكيمياء شهر 2","الكيمياء فصل 1","الكيمياء نصف سنة",
            "الكيمياء شهر 3","الكيمياء شهر 4","الكيمياء فصل 2","الكيمياء الامتحان النهائي",
            "الكيمياء السعي","الكيمياء التقدير"
        ],
        "الفيزياء": [
            "الفيزياء شهر 1","الفيزياء شهر 2","الفيزياء فصل 1","الفيزياء نصف سنة",
            "الفيزياء شهر 3","الفيزياء شهر 4","الفيزياء فصل 2","الفيزياء الامتحان النهائي",
            "الفيزياء السعي","الفيزياء التقدير"
        ],
        "الاحياء": [
            "الاحياء شهر 1","الاحياء شهر 2","الاحياء فصل 1","الاحياء نصف سنة",
            "الاحياء شهر 3","الاحياء شهر 4","الاحياء فصل 2","الاحياء الامتحان النهائي",
            "الاحياء السعي","الاحياء التقدير"
        ],
        "الاجتماعيات": [
            "الاجتماعيات شهر 1","الاجتماعيات شهر 2","الاجتماعيات فصل 1","الاجتماعيات نصف سنة",
            "الاجتماعيات شهر 3","الاجتماعيات شهر 4","الاجتماعيات فصل 2","الاجتماعيات الامتحان النهائي",
            "الاجتماعيات السعي","الاجتماعيات التقدير"
        ],
        "الحاسوب": [
            "الحاسوب شهر 1","الحاسوب شهر 2","الحاسوب فصل 1","الحاسوب نصف سنة",
            "الحاسوب شهر 3","الحاسوب شهر 4","الحاسوب فصل 2","الحاسوب الامتحان النهائي",
            "الحاسوب السعي","الحاسوب التقدير"
        ],
        "رياضة": [
            "رياضة شهر 1","رياضة شهر 2","رياضة فصل 1","رياضة نصف سنة",
            "رياضة شهر 3","رياضة شهر 4","رياضة فصل 2","رياضة الامتحان النهائي",

        subjects[sub].forEach(col => {

                <div class="grade-row">
                    <span>${col}</span>
                    <span>${st[col] || "-"}</span>
                </div>
            `;
        });

        const colName = getObjectionColumn(sub);

        html += `
            <button class="objection-btn"
                onclick="sendObjection('${code}', '${colName}', '${sub}')">

    }

    // بطاقة واحدة أسفل المواد لمعلومات (الغياب + الملاحظات)
    html += `
        <div class="grades-info-card">

        </div>
    `;

    document.getElementById("gradesPage").innerHTML = html;
}

/* =========================
   تسجيل الخروج
========================= */
function logout() {

    const code = localStorage.getItem("studentCode");

    if (code) {
        updateState(code, "خرج");
    }

    localStorage.removeItem("loggedIn");
    localStorage.removeItem("studentCode");
    location.reload();
}

/* =========================
   Navigation + Animation
========================= */
function showPage(pageId, element = null) {

    document.querySelectorAll(".page").forEach(p => p.style.display = "none");

    document.getElementById(pageId).style.display = "block";

    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));

    if (element) {
        element.classList.add("active");

        let burst = document.createElement("span");
        burst.classList.add("burst");
        burst.style.left = "50%";
        burst.style.top = "50%";
        element.appendChild(burst);

        setTimeout(() => burst.remove(), 500);
    }
}

</script>

</body>
</html>
