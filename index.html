<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام استعلام الطالب</title>

<style>

body {
    font-family: 'Cairo', sans-serif;
    direction: rtl;
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #d0e2ff, #ffffff, #7ab3ff);
    background-size: cover;
    background-attachment: fixed;
}

/* حاوية المحتوى */
.container {
    padding: 20px;
    max-width: 450px;
    margin: auto;
}

/* الحقول والأزرار */
input, button {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border-radius: 10px;
    margin-top: 10px;
    border: 1px solid #ccc;
}

/* زر تسجيل الدخول */
#loginBtn {
    background: #007bff;
    color: white;
    border: none;
    font-weight: bold;
}

/* صناديق الصفحات */
.section {
    background: white;
    padding: 15px;
    margin: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
}

.page {
    display: none;
}

</style>
</head>

<body>

<!-- شاشة البداية -->
<div style="text-align:center; padding:25px 10px;">
    <div style="font-size:28px; font-weight:bold; color:#004a9f;">قسم الحوكمة</div>
    <div style="font-size:20px; margin-top:5px; color:#333;">احمد عبد الرحمن احمد</div>
</div>

<!-- العنوان -->
<header style="text-align: center; font-size: 22px; padding: 15px; font-weight: bold; color:#004a9f;">
📘 نظام استعلام الطالب
</header>

<!-- منطقة تسجيل الدخول -->
<div class="container">
    <input id="studentCode" placeholder="أدخل كود الطالب">
    <button id="loginBtn" onclick="searchStudent()">تسجيل الدخول</button>
    <div id="output"></div>
</div>

<!-- الصفحات -->
<div id="profilePage" class="page section"></div>
<div id="gradesPage" class="page section">لا توجد درجات حالياً</div>
<div id="notifyPage" class="page section">لا توجد تبليغات حالياً</div>
<div id="chatPage" class="page section">لا توجد رسائل حالياً</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxQZfPQU_fM6lFEyygG59MsjgUduv974XsO_EkBXLVbzX7rtaJIH_oe9HwMfN-1hyxa/exec";

/* البحث عن الطالب */
async function searchStudent() {
    let code = document.getElementById("studentCode").value.trim();
    let output = document.getElementById("output");

    if (!code) {
        output.innerHTML = "<p style='color:red;text-align:center'>⚠️ يرجى إدخال الكود</p>";
        return;
    }

    output.innerHTML = "<p style='text-align:center;font-weight:bold'>⏳ جاري التحميل...</p>";

    try {
        let res = await fetch(`${API_URL}?code=${code}`);
        let data = await res.json();

        if (data.status !== "success") {
            output.innerHTML = `<p style='color:red;text-align:center'>❌ ${data.data}</p>`;
            return;
        }

        let student = data.data;

        // إخفاء عناصر الدخول
        document.getElementById("studentCode").style.display = "none";
        document.getElementById("loginBtn").style.display = "none";
        output.innerHTML = "";

        // رسالة الترحيب
        let welcomeMsg = document.createElement("div");
        welcomeMsg.innerText = "مرحباً بك في منصة التحدي";
        welcomeMsg.style.textAlign = "center";
        welcomeMsg.style.fontSize = "18px";
        welcomeMsg.style.marginTop = "10px";
        welcomeMsg.style.fontWeight = "bold";
        welcomeMsg.style.color = "#0050b3";
        document.body.prepend(welcomeMsg);

        loadProfile(student);

    } catch (err) {
        output.innerHTML = "<p style='color:red;text-align:center'>❌ خطأ في الاتصال بالخادم</p>";
    }
}

/* تحميل الملف الشخصي */
function loadProfile(student) {
    document.getElementById("profilePage").innerHTML = `
        <h3>📄 الملف الشخصي</h3>
        <table style="width:100%; border-collapse:collapse;">
            <tr><th>ID</th><td>${student["id"] || ""}</td></tr>
            <tr><th>اسم الطالب</th><td>${student["اسم الطالب"] || ""}</td></tr>
            <tr><th>الصف</th><td>${student["الصف"] || ""}</td></tr>
            <tr><th>القاعة</th><td>${student["القااعة"] || ""}</td></tr>
            <tr><th>الجنس</th><td>${student["الجنس"] || ""}</td></tr>
            <tr><th>كود الطالب</th><td>${student["كود الطالب"] || ""}</td></tr>
            <tr><th>الكتب</th><td>${student["الكتب"] || ""}</td></tr>
            <tr><th>الملاحظات</th><td>${student["الملاحظات"] || ""}</td></tr>
        </table>
    `;

    showPage("profilePage");
}

/* عرض صفحة */
function showPage(pageId) {
    document.querySelectorAll(".page").forEach(p => p.style.display = "none");
    document.getElementById(pageId).style.display = "block";
}

</script>

</body>
</html>
