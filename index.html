<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام استعلام الطالب</title>

<style>
body {
  font-family: 'Cairo', sans-serif;
  direction: rtl;
  background: #f2f7ff;
  margin: 0;
  padding: 0;
}

header {
  background: #007bff;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.container {
  padding: 20px;
}

input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

#searchBtn { background: #28a745; color: white; width: 100%; margin-top: 10px; }
#logoutBtn { background: #dc3545; color: white; width: 100%; margin-top: 10px; display: none; }
#saveBtn { background: #ffc107; color: black; width: 100%; margin-top: 10px; }

.section {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-top: 20px;
  box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 8px;
  border: 1px solid #ddd;
}
</style>
</head>
<body>

<header>
📘 نظام استعلام الطالب
</header>

<div class="container">

  <input id="studentCode" placeholder="أدخل كود الطالب">

  <button id="searchBtn" onclick="searchStudent()">تسجيل الدخول</button>
  <button id="logoutBtn" onclick="logout()">تسجيل خروج</button>

  <div id="output"></div>

</div>

<script>
/* -----------------------------
   تحميل الجلسة عند فتح الصفحة
-------------------------------- */
window.addEventListener("DOMContentLoaded", () => {
  const logged = localStorage.getItem("loggedIn");

  if (logged === "true") {
    const savedCode = localStorage.getItem("studentCode");
    if (savedCode) {
      document.getElementById("studentCode").value = savedCode;
      document.getElementById("logoutBtn").style.display = "block";
      searchStudent(false);
    }
  }
});

/* -----------------------------
    دالة البحث (تسجيل الدخول)
-------------------------------- */
async function searchStudent(saveSession = true) {
  let code = document.getElementById("studentCode").value.trim();
  const output = document.getElementById("output");

  if (!code) {
    output.innerHTML = "<p style='color:red;text-align:center'>⚠ أدخل كود الطالب</p>";
    return;
  }

  output.innerHTML = "<p style='text-align:center'>⏳ جاري التحميل...</p>";

  const apiURL = `https://script.google.com/macros/s/AKfycbyZA_OVj1eifCRo0elMDmD0cOtakEMx8DmzLSlTr8ptaBfMdGIsDjQkMxbW97PHTY9B/exec?code=${code}`;

  try {
    const response = await fetch(apiURL);
    const data = await response.json();

    if (data.status !== "success") {
      output.innerHTML = "<p style='color:red;text-align:center'>❌ الطالب غير موجود</p>";
      return;
    }

    const student = data.student;

    // حفظ الجلسة
    if (saveSession) {
      localStorage.setItem("loggedIn", "true");
      localStorage.setItem("studentCode", code);
    }

    // تسجيل دخول في الشيت
    updateLoginState(code, "تم تسجيل الدخول");

    document.getElementById("logoutBtn").style.display = "block";

    output.innerHTML = `
      <div class="section">
        <h3>المعلومات العامة (قابلة للتعديل)</h3>
        <table>
          ${editableRow("رقم ولي الامر", student["رقم ولي الامر"])}
          ${editableRow("المدرسة القادم منها", student["المدرسة القادم منها"])}
          ${editableRow("اسم الام", student["اسم الام"])}
          ${editableRow("رقم الخط", student["رقم الخط"])}
          ${editableRow("العنوان", student["العنوان"])}
        </table>
        <button id="saveBtn" onclick="saveChanges('${code}')">💾 حفظ التعديلات</button>
      </div>
    `;

  } catch (e) {
    output.innerHTML = "<p style='color:red;text-align:center'>❌ خطأ في الاتصال</p>";
  }
}

/* -----------------------------
   صف قابل للتعديل
-------------------------------- */
function editableRow(label, value) {
  return `
    <tr>
      <th>${label}</th>
      <td><input id="${label}" value="${value || ""}"></td>
    </tr>
  `;
}

/* -----------------------------
    حفظ التعديلات
-------------------------------- */
async function saveChanges(code) {
  const fields = {
    "رقم ولي الامر": document.getElementById("رقم ولي الامر").value,
    "المدرسة القادم منها": document.getElementById("المدرسة القادم منها").value,
    "اسم الام": document.getElementById("اسم الام").value,
    "رقم الخط": document.getElementById("رقم الخط").value,
    "العنوان": document.getElementById("العنوان").value
  };

  const url = "https://script.google.com/macros/s/AKfycbyZA_OVj1eifCRo0elMDmD0cOtakEMx8DmzLSlTr8ptaBfMdGIsDjQkMxbW97PHTY9B/exec";

  await fetch(url, {
    method: "POST",
    body: JSON.stringify({
      action: "update",
      code: code,
      data: fields
    })
  });

  alert("✔ تم حفظ التعديلات");
}

/* -----------------------------
    تسجيل الدخول والخروج في الشيت
-------------------------------- */
async function updateLoginState(code, state) {
  const url = "https://script.google.com/macros/s/AKfycbyZA_OVj1eifCRo0elMDmD0cOtakEMx8DmzLSlTr8ptaBfMdGIsDjQkMxbW97PHTY9B/exec";

  await fetch(url, {
    method: "POST",
    body: JSON.stringify({
      action: "update_state",
      code: code,
      state: state
    })
  });
}

/* -----------------------------
    تسجيل الخروج ومسح الجلسة
-------------------------------- */
function logout() {
  const code = localStorage.getItem("studentCode");

  if (code) updateLoginState(code, "تم تسجيل الخروج");

  localStorage.removeItem("loggedIn");
  localStorage.removeItem("studentCode");

  location.reload();
}

</script>
</body>
</html>
