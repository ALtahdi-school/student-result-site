<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام استعلام الطالب</title>

<!-- ربط ملف الستايل -->
<link rel="stylesheet" href="style.css">

</head>
<body>

<header>📘 نظام استعلام الطالب</header>

<div class="container">

    <input id="studentCode" placeholder="أدخل كود الطالب">
    <button id="loginBtn" onclick="searchStudent()">تسجيل الدخول</button>

    <div id="output"></div>
</div>

<!-- الصفحات -->
<div id="profilePage" class="page section"></div>
<div id="gradesPage" class="page section">لا توجد درجات حالياً</div>
<div id="notifyPage" class="page section">لا توجد تبليغات حالياً</div>
<div id="chatPage" class="page section">لا توجد رسائل حالياً</div>

<!-- الشريط السفلي -->
<div id="bottomBar">
    <div class="nav-item" onclick="showPage('profilePage', this)">الملف الشخصي</div>
    <div class="nav-item" onclick="showPage('gradesPage', this)">الدرجات</div>
    <div class="nav-item" onclick="showPage('notifyPage', this)">التبليغات</div>
    <div class="nav-item" onclick="showPage('chatPage', this)">الدردشة</div>
</div>

<script>
// رابط السكربت
const API_URL = "https://script.google.com/macros/s/AKfycbxQZfPQU_fM6lFEyygG59MsjgUduv974XsO_EkBXLVbzX7rtaJIH_oe9HwMfN-1hyxa/exec";

/**********************************************
   استرجاع الجلسة
**********************************************/
window.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem("loggedIn") === "true") {
        const code = localStorage.getItem("studentCode");
        document.getElementById("studentCode").value = code;
        searchStudent(false);
    }
});

/**********************************************
   تسجيل الدخول
**********************************************/
async function searchStudent(saveSession = true) {
    let code = document.getElementById("studentCode").value.trim();
    let output = document.getElementById("output");

    if (!code) {
        output.innerHTML = "<p style='color:red;text-align:center'>⚠️ يرجى إدخال الكود</p>";
        return;
    }

    output.innerHTML = "<p style='text-align:center'>⏳ جاري التحميل...</p>";

    try {
        let res = await fetch(`${API_URL}?code=${code}`);
        let data = await res.json();

        if (data.status !== "success") {
            output.innerHTML = `<p style='color:red;text-align:center'>❌ ${data.data}</p>`;
            return;
        }

        let student = data.data;

        if (saveSession) {
            localStorage.setItem("loggedIn", "true");
            localStorage.setItem("studentCode", code);
            updateLoginState(code, "تم تسجيل الدخول");
        }

        document.getElementById("studentCode").style.display = "none";
        document.getElementById("loginBtn").style.display = "none";

        document.getElementById("bottomBar").style.display = "flex";

        loadProfile(student);

    } catch (err) {
        output.innerHTML = "<p style='color:red;text-align:center'>❌ خطأ في الاتصال بالخادم</p>";
    }
}

/**********************************************
   صفحة الملف الشخصي
**********************************************/
function loadProfile(student) {
    document.getElementById("profilePage").innerHTML = `
    <button onclick="logout()" style="
        background:#dc3545;color:white;
        padding:10px 15px;border:none;
        border-radius:8px;float:left;margin-bottom:10px;">
        🔐 تسجيل الخروج
    </button>

    <h3 style="clear:both">📄 الملف الشخصي</h3>

    <table>
      <tr><th>ID</th><td>${student["id"] || ""}</td></tr>
      <tr><th>اسم الطالب</th><td>${student["اسم الطالب"] || ""}</td></tr>

      <tr><th>المواليد</th>
          <td><input id="المواليد" value="${student["المواليد"] || ""}"></td>
      </tr>

      <tr><th>الصف</th><td>${student["الصف"] || ""}</td></tr>
      <tr><th>القاعة</th><td>${student["القاعة"] || ""}</td></tr>
      <tr><th>الجنس</th><td>${student["الجنس"] || ""}</td></tr>

      <tr><th>رقم ولي الأمر</th>
          <td><input id="رقم ولي الامر" value="${student["رقم ولي الامر"] || ""}"></td>
      </tr>

      <tr><th>رقم الخط</th>
          <td><input id="رقم الخط" value="${student["رقم الخط"] || ""}"></td>
      </tr>

      <tr><th>كود الطالب</th><td>${student["كود الطالب"] || ""}</td></tr>

      <tr><th>رقم الطالب</th>
          <td><input id="رقم الطالب" value="${student["رقم الطالب"] || ""}"></td>
      </tr>

      <tr><th>الكتب</th><td>${student["الكتب"] || ""}</td></tr>

      <tr><th>العنوان</th>
          <td><input id="العنوان" value="${student["العنوان"] || ""}"></td>
      </tr>

      <tr><th>اسم الأم</th>
          <td><input id="اسم الام" value="${student["اسم الام"] || ""}"></td>
      </tr>

      <tr><th>المدرسة القادم منها</th>
          <td><input id="المدرسة القادم منها" value="${student["المدرسة القادم منها"] || ""}"></td>
      </tr>

      <tr><th>المعدل في الصف السابق</th><td>${student["المعدل في الصف السابق"] || ""}</td></tr>
      <tr><th>الملاحظات</th><td>${student["الملاحظات"] || ""}</td></tr>
    </table>

    <button onclick="saveChanges('${student["كود الطالب"]}')" 
            style="width:100%;padding:12px;margin-top:15px;
            border:none;border-radius:8px;background:#ffc107;font-size:15px">
        💾 حفظ التعديلات
    </button>
    `;

    showPage("profilePage");
}

/**********************************************
   حفظ التعديلات
**********************************************/
async function saveChanges(code) {
    const data = {
        "المواليد": document.getElementById("المواليد").value,
        "رقم ولي الامر": document.getElementById("رقم ولي الامر").value,
        "رقم الخط": document.getElementById("رقم الخط").value,
        "رقم الطالب": document.getElementById("رقم الطالب").value,
        "العنوان": document.getElementById("العنوان").value,
        "اسم الام": document.getElementById("اسم الام").value,
        "المدرسة القادم منها": document.getElementById("المدرسة القادم منها").value
    };

    await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
            action: "update",
            code: code,
            data: data
        })
    });

    alert("✔ تم حفظ التعديلات بنجاح");
}

/**********************************************
   تحديث حالة الطالب
**********************************************/
async function updateLoginState(code, state) {
    await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
            action: "update_state",
            code: code,
            state: state
        })
    });
}

/**********************************************
   تسجيل الخروج
**********************************************/
function logout() {
    const code = localStorage.getItem("studentCode");

    updateLoginState(code, "تم تسجيل الخروج");

    localStorage.removeItem("loggedIn");
    localStorage.removeItem("studentCode");

    location.reload();
}

/**********************************************
   التنقل بين الصفحات
**********************************************/
function showPage(pageId, element = null) {
    document.querySelectorAll(".page").forEach(p => p.style.display = "none");
    document.getElementById(pageId).style.display = "block";

    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    if (element) element.classList.add("active");
}
</script>

</body>
</html>
