<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام استعلام الطالب</title>

<style>
body {
  font-family: 'Cairo', sans-serif;
  direction: rtl;
  background: #eef4ff;
  margin: 0; padding: 0;
}

header {
  background: #0066ff;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.container { padding: 20px; }

input {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
  cursor: pointer;
  font-size: 15px;
}

#loginBtn { background: #28a745; color: white; }
#logoutBtn { background: #dc3545; color: white; display: none; }
#saveBtn { background: #ffc107; color: black; }

.section {
  background: white;
  padding: 15px;
  margin-top: 20px;
  border-radius: 12px;
  box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
}

table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td {
  border: 1px solid #ddd;
  padding: 8px;
}
th { background: #f7f7f7; }
</style>

</head>
<body>

<header>📘 نظام استعلام الطالب</header>

<div class="container">

  <input id="studentCode" placeholder="أدخل كود الطالب">

  <button id="loginBtn" onclick="searchStudent()">تسجيل الدخول</button>
  <button id="logoutBtn" onclick="logout()">تسجيل خروج</button>

  <div id="output"></div>

</div>

<script>
/************************************************
   عند فتح الصفحة — استرجاع الجلسة إن وجدت
************************************************/
window.addEventListener("DOMContentLoaded", () => {
  if (localStorage.getItem("loggedIn") === "true") {
    let savedCode = localStorage.getItem("studentCode");
    document.getElementById("studentCode").value = savedCode;
    document.getElementById("logoutBtn").style.display = "block";
    searchStudent(false);
  }
});


/************************************************
    تسجيل الدخول وجلب بيانات الطالب
************************************************/
async function searchStudent(saveSession = true) {
  let code = document.getElementById("studentCode").value.trim();
  const output = document.getElementById("output");

  if (!code) {
    output.innerHTML = "<p style='color:red;text-align:center'>⚠ أدخل كود الطالب</p>";
    return;
  }

  output.innerHTML = "<p style='text-align:center'>⏳ جاري التحميل...</p>";

  const url = `https://script.google.com/macros/s/AKfycbyZA_OVj1eifCRo0elMDmD0cOtakEMx8DmzLSlTr8ptaBfMdGIsDjQkMxbW97PHTY9B/exec?code=${code}`;

  try {
    let res = await fetch(url);
    let data = await res.json();

    if (data.status !== "success") {
      output.innerHTML = "<p style='color:red;text-align:center'>❌ بيانات الطالب غير موجودة</p>";
      return;
    }

    let student = data.student;

    if (saveSession) {
      localStorage.setItem("loggedIn", "true");
      localStorage.setItem("studentCode", code);
    }

    document.getElementById("logoutBtn").style.display = "block";

    updateLoginState(code, "تم تسجيل الدخول");

    output.innerHTML = `
      <div class="section">
        <h3>المعلومات العامة (قابلة للتعديل)</h3>
        <table>
          ${editableRow("رقم ولي الامر", student["رقم ولي الامر"])}
          ${editableRow("المدرسة القادم منها", student["المدرسة القادم منها"])}
          ${editableRow("اسم الام", student["اسم الام"])}
          ${editableRow("رقم الخط", student["رقم الخط"])}
          ${editableRow("العنوان", student["العنوان"])}
          ${editableRow("المواليد", student["المواليد"])}
        </table>
        <button id="saveBtn" onclick="saveChanges('${code}')">💾 حفظ التعديلات</button>
      </div>
    `;

  } catch (err) {
    output.innerHTML = "<p style='color:red;text-align:center'>❌ خطأ في الاتصال</p>";
  }
}


/************************************************
    إنشاء صف قابل للتعديل
************************************************/
function editableRow(label, value) {
  return `
    <tr>
      <th>${label}</th>
      <td><input id="${label}" value="${value || ""}"></td>
    </tr>
  `;
}


/************************************************
    حفظ التعديلات وإرسالها للسيرفر
************************************************/
async function saveChanges(code) {
  const fields = {
    "رقم ولي الامر": document.getElementById("رقم ولي الامر").value,
    "المدرسة القادم منها": document.getElementById("المدرسة القادم منها").value,
    "اسم الام": document.getElementById("اسم الام").value,
    "رقم الخط": document.getElementById("رقم الخط").value,
    "العنوان": document.getElementById("العنوان").value,
    "المواليد": document.getElementById("المواليد").value
  };

  await fetch("https://script.google.com/macros/s/AKfycbyZA_OVj1eifCRo0elMDmD0cOtakEMx8DmzLSlTr8ptaBfMdGIsDjQkMxbW97PHTY9B/exec", {
    method: "POST",
    body: JSON.stringify({ action: "update", code: code, data: fields })
  });

  alert("✔ تم حفظ التعديلات بنجاح");
}


/************************************************
    تحديث حالة الدخول والخروج في الشيت
************************************************/
async function updateLoginState(code, state) {
  await fetch("https://script.google.com/macros/s/AKfycbyZA_OVj1eifCRo0elMDmD0cOtakEMx8DmzLSlTr8ptaBfMdGIsDjQkMxbW97PHTY9B/exec", {
    method: "POST",
    body: JSON.stringify({ action: "update_state", code: code, state: state })
  });
}


/************************************************
    تسجيل الخروج ومسح الجلسة
************************************************/
function logout() {
  const code = localStorage.getItem("studentCode");

  if (code) updateLoginState(code, "تم تسجيل الخروج");

  localStorage.removeItem("loggedIn");
  localStorage.removeItem("studentCode");

  location.reload();
}
</script>

</body>
</html>
