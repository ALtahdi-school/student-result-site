<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول الطالب</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

body{
  font-family:'Cairo',sans-serif;
  direction:rtl;
  margin:0;
  padding:0;
  background:linear-gradient(to bottom,#007bff,#6a0dad,#ffffff);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-container{
  background:#fff;
  padding:30px 25px;
  border-radius:15px;
  width:100%;
  max-width:400px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.login-container h2{
  text-align:center;
  margin-bottom:25px;
}

.input-group{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.input-group input{
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:10px;
  font-size:14px;
}

#loginBtn{background:#28a745;color:#fff;}
#loginBtn:hover{background:#218838;}

#whatsappBtn{background:#25D366;color:#fff;}
#whatsappBtn:hover{background:#1ebe57;}

.message{
  margin-top:10px;
  min-height:20px;
  text-align:center;
  white-space:pre-line;
}
</style>
</head>
<body>

<div class="login-container">
  <h2>تسجيل دخول الطالب</h2>

  <div class="input-group">
    <input id="parentNumber" placeholder="أدخل رقم ولي الأمر">
    <input id="studentCode" placeholder="أدخل كود الطالب">
  </div>

  <button id="loginBtn" onclick="login()">تسجيل الدخول</button>
  <button id="whatsappBtn" onclick="openWhatsApp()">الدعم السريع واتساب</button>

  <div class="message" id="message"></div>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwimKjV1uHCxq1DLUQ_hJguMjB4Xi6hw9OGxrlMWheHGhNRzCDLySvnIFBX9-2bQCXo/exec";

function normalize(v){
  v = String(v||"").trim();
  v = v.replace(/\s+/g,"");
  if(v.startsWith("0")) v = v.substring(1);
  return v;
}

function openWhatsApp(){
  window.open("https://wsend.co/9647851521585","_blank");
}

async function login(){
  const rawParent = document.getElementById("parentNumber").value.trim();
  const rawCode   = document.getElementById("studentCode").value.trim();
  const msg       = document.getElementById("message");

  if(!rawParent || !rawCode){
    msg.style.color="#dc3545";
    msg.textContent="⚠️ الرجاء إدخال رقم ولي الأمر وكود الطالب.";
    return;
  }

  const parent = normalize(rawParent);
  const code   = normalize(rawCode);

  msg.style.color="#333";
  msg.textContent="⏳ جاري التحقق...";

  const body = new URLSearchParams({
    action:"check",
    parent:parent,
    code:code
  });

  try{
    const res = await fetch(SHEET_URL,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:body.toString()
    });

    const data = await res.json();
    console.log("SCRIPT RESPONSE:",data);

    if(data.valid){
      msg.style.color="#28a745";
      msg.textContent="✅ تسجيل الدخول ناجح";

      localStorage.setItem("parentNumber",parent);
      localStorage.setItem("studentCode",code);

      setTimeout(()=>{ window.location.href="main.html"; },1000);

    }else{
      msg.style.color="#dc3545";
      msg.textContent = data.message ? data.message : "❌ بيانات خاطئة";
    }

  }catch(err){
    msg.style.color="#dc3545";
    msg.textContent="⚠️ خطأ أثناء الاتصال بالسيرفر.";
  }
}
</script>

</body>
</html>
