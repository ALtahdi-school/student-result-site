<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول الطالب</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

body {
  font-family: 'Cairo', sans-serif;
  direction: rtl;
  margin: 0;
  padding: 0;
  background: linear-gradient(to bottom, #007bff, #6a0dad, #ffffff);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-container {
  background: #fff;
  padding: 30px 25px;
  border-radius: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  width: 100%;
  max-width: 400px;
}

.login-container h2 {
  text-align: center;
  margin-bottom: 25px;
  color: #333;
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.input-group input {
  padding: 12px;
  font-size: 14px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  padding: 10px 20px;
  font-size: 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
  width: 100%;
}

#loginBtn {
  background: #28a745;
  color: #fff;
}

#loginBtn:hover {
  background: #218838;
}

.message {
  text-align: center;
  margin-top: 10px;
  color: #dc3545;
  min-height: 20px;
}
</style>

</head>
<body>

<div class="login-container">
  <h2>تسجيل دخول الطالب</h2>

  <div class="input-group">
    <input id="parentNumber" placeholder="رقم ولي الأمر">
    <input id="studentCode" placeholder="كود الطالب">
  </div>

  <button id="loginBtn" onclick="login()">تسجيل الدخول</button>

  <div class="message" id="message"></div>
</div>

<script>
const SHEET_URL = "YOUR_SCRIPT_URL_HERE";  // ضع رابط السكربت هنا

function normalize(v){
  v = String(v||"").trim();
  v = v.replace(/\s+/g,"");
  if(v.startsWith("0")) v = v.substring(1);
  return v;
}

async function login() {
  const rawParent = document.getElementById("parentNumber").value.trim();
  const rawCode   = document.getElementById("studentCode").value.trim();
  const msg       = document.getElementById("message");

  if (!rawParent || !rawCode) {
    msg.textContent = "⚠️ الرجاء ملء جميع الحقول.";
    return;
  }

  const parent = normalize(rawParent);
  const code   = normalize(rawCode);

  msg.style.color = "#333";
  msg.textContent = "⏳ جاري التحقق...";

  const body = new URLSearchParams({
    action: "check",
    parent: parent,
    code: code
  });

  try {
    const res  = await fetch(SHEET_URL, {
      method: "POST",
      headers: { "Content-Type":"application/x-www-form-urlencoded" },
      body: body.toString()
    });

    const data = await res.json();

    if (data.valid) {
      msg.style.color = "#28a745";
      msg.textContent = "✔ تسجيل الدخول ناجح";

      // 🔥 تخزين البيانات بعد التطبيع
      localStorage.setItem("parentNumber", parent);
      localStorage.setItem("studentCode", code);

      setTimeout(()=>{ window.location.href="main.html"; },700);

    } else {
      msg.style.color="#dc3545";
      msg.textContent = data.message || "❌ بيانات غير صحيحة";
    }

  } catch (err) {
    msg.style.color="#dc3545";
    msg.textContent = "⚠️ خطأ أثناء الاتصال بالسيرفر.";
  }
}

window.onload = ()=>{
  if(localStorage.getItem("parentNumber") && localStorage.getItem("studentCode")){
    window.location.href="main.html";
  }
}
</script>

</body>
</html>
