<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام استعلام الطالب</title>

<style>

/* =========================
   خلفية نيون قوية
========================= */
body {
    font-family: 'Cairo', sans-serif;
    direction: rtl;
    background: linear-gradient(135deg,
        #0011ff,
        #8a00ff,
        #ff0077);
    background-size: 400% 400%;
    animation: neonMove 10s infinite ease-in-out;
    margin: 0;
    padding: 0 0 120px 0;
    overflow-x: hidden;
}

@keyframes neonMove {
    0% { background-position: 0% 50% }
    50% { background-position: 100% 50% }
    100% { background-position: 0% 50% }
}

/* =========================
   Splash Screen
========================= */
#splash {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: white;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    animation: splashFadeOut 3.5s forwards;
}

@keyframes splashFadeOut {
    0% { opacity: 1 }
    80% { opacity: 1 }
    100% { opacity: 0; visibility: hidden }
}

.splash-title {
    font-size: 30px;
    font-weight: bold;
    color: #7a00ff;
}

.splash-sub, .splash-year, .splash-copy {
    color: #222;
    margin-top: 8px;
}

/* =========================
   Fade Page
========================= */
header, .container {
    opacity: 0;
    animation: fadePage 2s 3.4s forwards;
}

@keyframes fadePage {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
}

header {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    padding: 20px;
    font-size: 22px;
    text-align: center;
    color: white;
    font-weight: bold;
}

/* =========================
    إدخال البيانات
========================= */
.container {
    padding: 20px;
}

input, button {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    border-radius: 12px;
    margin-top: 10px;
    border: none;
}

input {
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(8px);
    color: #000;
}

input:focus {
    outline: none;
    box-shadow: 0 0 8px #ff00c8;
}

button {
    background: #00d17d;
    color: white;
    font-weight: bold;
    animation: pulseButton 3s infinite;
}

button:hover { transform: scale(1.04); }
button:active { transform: scale(0.94); }

@keyframes pulseButton {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
}

/* =========================
     Error Shake
========================= */
@keyframes shake {
    0% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-7px); }
    80% { transform: translateX(7px); }
    100% { transform: translateX(0); }
}

.shake { animation: shake 0.45s ease; }

.error {
    color: yellow;
    font-weight: bold;
    text-align: center;
}

/* =========================
    صفحة الملف الشخصي
========================= */
.section {
    background: rgba(255,255,255,0.3);
    backdrop-filter: blur(12px);
    padding: 15px;
    margin: 20px;
    border-radius: 18px;
    color: black;
}

/* أزرار الحفظ والخروج */
.profile-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.logout-btn {
    background: #ff1744;
    color: white;
    font-weight: bold;
}

.save-btn {
    background: #ffca28;
    color: black;
    font-weight: bold;
}

/* جدول البيانات */
table {
    width: 100%;
    border-collapse: collapse;
}

td, th {
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.4);
}

input.table-input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.4);
}

/* =========================
   البار السفلي — زجاجي Neon
========================= */
#bottomBar {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 92%;
    height: 70px;
    border-radius: 30px;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.4);
    box-shadow: 0 5px 25px rgba(0,0,0,0.3);
    display: none;
    justify-content: space-around;
    align-items: center;
    color: white;
    transition: 0.8s ease;
}

#bottomBar.show-bar {
    transform: translateX(-50%) translateY(0);
}

.nav-item {
    font-size: 15px;
    cursor: pointer;
    opacity: 0.75;
    position: relative;
    overflow: hidden; 
}

.nav-item:hover { opacity: 1; }

/* انفجار */
.burst {
    position: absolute;
    width: 12px;
    height: 12px;
    background: white;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    animation: burstAnim 0.5s forwards;
}

@keyframes burstAnim {
    0%   { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(14); opacity: 0; }
}

/* =========================
   رسالة الترحيب
========================= */
#welcomeAnim {
    position: fixed;
    top: 25%;
    left: 50%;
    transform: translateX(-50%) scale(0.7);
    background: white;
    padding: 20px 30px;
    border-radius: 20px;
    font-size: 22px;
    color: #7b00ff;
    font-weight: bold;
    box-shadow: 0 5px 20px rgba(0,0,0,0.25);
    opacity: 0;
    animation: welcomeShow 2.5s forwards;
}

@keyframes welcomeShow {
    0% { opacity: 0; transform: translateX(-50%) scale(0.6); }
    40% { opacity: 1; transform: translateX(-50%) scale(1.1); }
    70% { transform: translateX(-50%) scale(1); }
    100% { opacity: 0; top: 10%; }
}

</style>
</head>

<body>

<!-- Splash -->
<div id="splash">
    <div class="splash-title">قسم الحوكمة</div>
    <div class="splash-sub">ثانوية التحدي الأهلية</div>
    <div class="splash-year">العام الدراسي 2025 - 2026</div>
    <div class="splash-copy">جميع الحقوق محفوظة ©</div>
</div>

<header>📘 نظام استعلام الطالب</header>

<div class="container">
    <input id="studentCode" placeholder="أدخل كود الطالب">
    <button id="loginBtn" onclick="searchStudent()">تسجيل الدخول</button>
    <div id="output"></div>
</div>

<!-- صفحات -->
<div id="profilePage" class="page section"></div>
<div id="gradesPage" class="page section">لا توجد درجات حالياً</div>
<div id="notifyPage" class="page section">لا توجد تبليغات حالياً</div>
<div id="chatPage" class="page section">لا توجد رسائل حالياً</div>

<!-- البار -->
<div id="bottomBar">
    <div class="nav-item" onclick="showPage('profilePage', this)">الملف الشخصي</div>
    <div class="nav-item" onclick="showPage('gradesPage', this)">الدرجات</div>
    <div class="nav-item" onclick="showPage('notifyPage', this)">التبليغات</div>
    <div class="nav-item" onclick="showPage('chatPage', this)">الدردشة</div>
</div>

<script>

const API_URL = 
 "https://script.google.com/macros/s/AKfycbxQZfPQU_fM6lFEyygG59MsjgUduv974XsO_EkBXLVbzX7rtaJIH_oe9HwMfN-1hyxa/exec";


/* تسجيل دخول تلقائي */
window.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem("loggedIn") === "true") {
        document.getElementById("studentCode").value =
            localStorage.getItem("studentCode");
        searchStudent(false);
    }
});

/* البحث عن الطالب */
async function searchStudent(saveSession = true) {

    let code = document.getElementById("studentCode").value.trim();
    let output = document.getElementById("output");
    let inputBox = document.getElementById("studentCode");
    let container = document.querySelector(".container");

    if (!code) {
        output.innerHTML = "<p class='error'>⚠️ يرجى إدخال الكود</p>";
        inputBox.classList.add("shake");
        container.classList.add("shake");
        setTimeout(()=>{inputBox.classList.remove("shake");container.classList.remove("shake");},450);
        return;
    }

    output.innerHTML = "<p class='loading-text'>⏳ جاري التحميل...</p>";

    try {
        let res = await fetch(`${API_URL}?code=${code}`);
        let data = await res.json();

        if (data.status !== "success") {
            output.innerHTML = `<p class='error'>❌ ${data.data}</p>`;
            inputBox.classList.add("shake");
            container.classList.add("shake");
            setTimeout(()=>{inputBox.classList.remove("shake");container.classList.remove("shake");},450);
            return;
        }

        let student = data.data;

        if (saveSession) {
            localStorage.setItem("loggedIn", "true");
            localStorage.setItem("studentCode", code);
        }

        document.getElementById("studentCode").style.display = "none";
        document.getElementById("loginBtn").style.display = "none";
        output.innerHTML = "";

        let welcome = document.createElement("div");
        welcome.id = "welcomeAnim";
        welcome.innerText = "أهلاً بك في منصة التحدي";
        document.body.appendChild(welcome);

        let bar = document.getElementById("bottomBar");
        bar.style.display = "flex";
        bar.classList.add("show-bar");

        loadProfile(student);

    } catch (err) {
        output.innerHTML = "<p class='error'>❌ خطأ في الاتصال بالخادم</p>";
    }
}



/* حفظ البيانات */
async function saveChanges(code) {

    const data = {
        "المواليد": document.getElementById("المواليد").value,
        "رقم ولي الامر": document.getElementById("رقم ولي الامر").value,
        "رقم الخط": document.getElementById("رقم الخط").value,
        "رقم الطالب": document.getElementById("رقم الطالب").value,
        "العنوان": document.getElementById("العنوان").value,
        "اسم الام": document.getElementById("اسم الام").value,
        "المدرسة القادم منها": document.getElementById("المدرسة القادم منها").value,
        "الرمز": document.getElementById("الرمز").value
    };

    await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
            action: "update",
            code: code,
            data: data
        })
    });

    alert("✔ تم حفظ التعديلات بنجاح");
}



/* تحميل الصفحة الشخصية */
function loadProfile(student) {

    const code = student["كود الطالب"] || "";

    document.getElementById("profilePage").innerHTML = `
    
    <div class="profile-actions">
        <button onclick="logout()" class="logout-btn">🔐 تسجيل الخروج</button>
        <button onclick="saveChanges('${code}')" class="save-btn">💾 حفظ التعديلات</button>
    </div>

    <h3>📄 الملف الشخصي</h3>

    <table>
      <tr><th>ID</th><td>${student["id"] || ""}</td></tr>
      <tr><th>اسم الطالب</th><td>${student["اسم الطالب"] || ""}</td></tr>
      <tr><th>المواليد</th><td><input class="table-input" id="المواليد" value="${student["المواليد"] || ""}"></td></tr>
      <tr><th>الصف</th><td>${student["الصف"] || ""}</td></tr>
      <tr><th>القاعة</th><td>${student["القاعة"] || ""}</td></tr>
      <tr><th>الجنس</th><td>${student["الجنس"] || ""}</td></tr>

      <tr><th>رقم ولي الأمر</th>
          <td><input class="table-input" id="رقم ولي الامر" value="${student["رقم ولي الامر"] || ""}"></td></tr>

      <tr><th>رقم الخط</th>
          <td><input class="table-input" id="رقم الخط" value="${student["رقم الخط"] || ""}"></td></tr>

      <tr><th>كود الطالب</th><td>${student["كود الطالب"] || ""}</td></tr>

      <tr><th>رقم الطالب</th>
          <td><input class="table-input" id="رقم الطالب" value="${student["رقم الطالب"] || ""}"></td></tr>

      <tr><th>الكتب</th><td>${student["الكتب"] || ""}</td></tr>

      <tr><th>العنوان</th>
          <td><input class="table-input" id="العنوان" value="${student["العنوان"] || ""}"></td></tr>

      <tr><th>اسم الأم</th>
          <td><input class="table-input" id="اسم الام" value="${student["اسم الام"] || ""}"></td></tr>

      <tr><th>المدرسة القادم منها</th>
          <td><input class="table-input" id="المدرسة القادم منها" value="${student["المدرسة القادم منها"] || ""}"></td></tr>

      <tr><th>المعدل في الصف السابق</th><td>${student["المعدل في الصف السابق"] || ""}</td></tr>

      <tr><th>الملاحظات</th><td>${student["الملاحظات"] || ""}</td></tr>

      <!-- الخانة الجديدة -->
      <tr><th>الرمز</th>
          <td><input class="table-input" id="الرمز" value="${student["الرمز"] || ""}"></td></tr>

    </table>
    `;

    showPage("profilePage");
}



/* تسجيل الخروج */
function logout() {
    localStorage.removeItem("loggedIn");
    localStorage.removeItem("studentCode");
    location.reload();
}



/* تغيير الصفحات + الانفجار */
function showPage(pageId, element = null) {

    document.querySelectorAll(".page")
        .forEach(p => p.style.display = "none");

    document.getElementById(pageId).style.display = "block";

    document.querySelectorAll(".nav-item")
        .forEach(n => n.classList.remove("active"));

    if (element) {
        element.classList.add("active");

        let burst = document.createElement("span");
        burst.classList.add("burst");
        burst.style.left = "50%";
        burst.style.top = "50%";
        element.appendChild(burst);

        setTimeout(() => burst.remove(), 500);
    }
}

</script>

</body>
</html>
