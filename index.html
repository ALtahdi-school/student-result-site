<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة التحدي 2025-2026</title>

<style>

/* ============================================================
   🔥 خلفية نيون متحركة — ألوان (أزرق + أحمر + أخضر + برتقالي)
   ============================================================ */

body {
  direction: rtl;
  margin: 0;
  padding: 0;
  font-family: 'Cairo', sans-serif;
  overflow-x: hidden;
  background: #000;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 25%, rgba(0,140,255,0.75), transparent 55%),
    radial-gradient(circle at 85% 20%, rgba(255,60,60,0.75), transparent 55%),
    radial-gradient(circle at 25% 85%, rgba(60,255,140,0.75), transparent 55%),
    radial-gradient(circle at 80% 80%, rgba(255,180,0,0.75), transparent 55%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.35), transparent 60%);
  filter: blur(55px) brightness(1.15);
  animation: bgMove 22s ease-in-out infinite alternate;
  z-index: -3;
}

@keyframes bgMove {
  0%   { transform: scale(1) translate(0,0); }
  25%  { transform: scale(1.2) translate(-40px,20px); }
  50%  { transform: scale(1.15) translate(40px,-35px); }
  75%  { transform: scale(1.25) translate(-20px,-40px); }
  100% { transform: scale(1.15) translate(30px,40px); }
}


/* ============================================================
   ✨ تأثير اللمعة Shine كل 3 ثواني على كل الأزرار
   ============================================================ */

button {
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: 0.25s ease;
  z-index: 1;
  font-weight: bold;
}

button:hover {
  transform: scale(1.05);
}

button:active {
  transform: scale(0.93);
}

/* طبقة اللمعة */
button::after {
  content: "";
  position: absolute;
  top: 0;
  left: -150%;
  width: 80%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.55),
    transparent
  );
  transform: skewX(-25deg);
  filter: blur(5px);
  animation: shineAnimation 3s infinite ease-in-out;
}

@keyframes shineAnimation {
  0%   { left: -150%; }
  40%  { left: 130%; }
  100% { left: 130%; }
}


/* ============================================================
   🌊 تأثير الموجة Ripple عند الضغط
   ============================================================ */

button .ripple {
  position: absolute;
  background: rgba(255,255,255,0.45);
  border-radius: 50%;
  transform: scale(0);
  animation: rippleEffect .6s linear;
  pointer-events: none;
  z-index: -1;
}

@keyframes rippleEffect {
  to {
    transform: scale(13);
    opacity: 0;
  }
}


/* ============================================================
   🚀 Splash Screen
   ============================================================ */

#splash {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  animation: splashFade 3.6s forwards;
  z-index: 9999;
}

@keyframes splashFade {
  0%,70% { opacity: 1; }
  100%   { opacity: 0; visibility: hidden; }
}

.splash-title { font-size: 32px; font-weight: bold; color:#007bff; }
.splash-sub   { font-size: 19px; color:#004a99; margin-top: 8px; }
.splash-year  { font-size: 15px; color:#ff7043; margin-top: 4px; }


/* ============================================================
   🏷️ العنوان الرئيسي
   ============================================================ */

header {
  color: white;
  padding: 18px;
  text-align: center;
  font-size: 23px;
  font-weight: bold;
  opacity: 0;
  animation: fadeIn 1.4s 3.0s forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}


/* ============================================================
   🔐 صندوق تسجيل الدخول
   ============================================================ */

.login-box {
  width: 92%;
  max-width: 380px;
  margin: 140px auto 0;
  padding: 22px;
  text-align: center;
  border-radius: 22px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(22px);
  border: 1px solid rgba(255,255,255,0.4);
  box-shadow: 0 15px 40px rgba(0,0,0,0.45);
  animation: slideIn 1.4s ease-out;
}

@keyframes slideIn {
  0%   { transform: translateY(60px); opacity:0; }
  100% { transform: translateY(0); opacity:1; }
}

.login-box input,
.login-box button {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border-radius: 14px;
  border: none;
  box-sizing: border-box;
  margin-top: 14px;
}

.login-box input {
  background: rgba(255,255,255,0.95);
  text-align: center;
  font-weight: bold;
  color: #004a99;
  box-shadow: 0 0 0 2px rgba(0,0,0,0.08);
}

.login-box input:focus {
  box-shadow: 0 0 0 2px #00b0ff;
}

.login-box button {
  background: linear-gradient(135deg, #00d46a, #009944);
  color: white;
  box-shadow: 0 8px 18px rgba(0,0,0,0.3);
}


/* ============================================================
   🧩 الصفحات العامة
   ============================================================ */

.page {
  display: none;
  animation: fadePage .6s ease;
}

@keyframes fadePage {
  0%   { opacity: 0; transform: translateY(25px); }
  100% { opacity: 1; transform: translateY(0); }
}

.section {
  margin: 20px;
  padding: 15px;
  border-radius: 18px;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(18px);
  color: white;
  font-weight: bold;
}


/* ============================================================
   ⬇️ شريط التنقل السفلي — BottomBar
   ============================================================ */

#bottomBar {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(120%);
  width: 92%;
  height: 75px;
  backdrop-filter: blur(22px);
  background: rgba(255,255,255,0.2);
  border-radius: 24px;
  border: 1px solid rgba(255,255,255,0.35);
  color: white;
  display: none;
  align-items: center;
  justify-content: space-around;
  transition: 0.8s;
  box-shadow: 0 12px 30px rgba(0,0,0,0.35);
}

#bottomBar.show-bar {
  transform: translateX(-50%) translateY(0);
}

.nav-item {
  cursor: pointer;
  opacity: .7;
}

.nav-item.active,
.nav-item:hover {
  opacity: 1;
}


/* ============================================================
   🟩 بطاقات الدرجات للطالب
   ============================================================ */

.grade-card {
  background: linear-gradient(135deg, #00c853, #009624);
  padding: 15px;
  border-radius: 18px;
  margin-bottom: 20px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.35);
}

.grade-title {
  font-size: 19px;
  margin-bottom: 10px;
  border-bottom: 2px solid rgba(255,255,255,0.4);
}

.grade-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.4);
}


/* زر الاعتراض */
.objection-btn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #ff1744, #d50000);
  border-radius: 14px;
  border: none;
  font-size: 15px;
  margin-top: 14px;
  color: white;
  box-shadow: 0 5px 15px rgba(255,0,0,0.4);
}


/* ============================================================
   👨‍🏫 واجهة الأستاذ — الصفوف والدرجات
   ============================================================ */

.teacher-class-btn {
  background: linear-gradient(135deg, #00e1ff, #007bff);
  color: white;
  padding: 14px;
  border-radius: 12px;
  border: none;
  width: 48%;
  margin-bottom: 10px;
}

.teacher-table-wrapper {
  overflow-x: auto;
  margin-top: 20px;
}

#teacherGradesTable {
  width: 900px;
  max-width: 100%;
  border-collapse: collapse;
}

#teacherGradesTable th {
  background: rgba(255,255,255,0.25);
  color: #003f7d;
  padding: 8px;
}

#teacherGradesTable td {
  padding: 8px;
  color: white;
}

.teacher-grade-input {
  width: 60px;
  padding: 6px;
  border-radius: 8px;
  border: none;
  text-align: center;
}

.teacher-save-btn,
.teacher-pdf-btn,
.teacher-clear-btn {
  width: 100%;
  padding: 12px;
  border-radius: 14px;
  border: none;
  margin-top: 12px;
  color: white;
  font-weight: bold;
}

/* ألوان الأزرار */
.teacher-save-btn { background: linear-gradient(135deg,#19e05a,#0a9b32); }
.teacher-pdf-btn  { background: linear-gradient(135deg,#00b0ff,#0066ff); }
.teacher-clear-btn{ background: linear-gradient(135deg,#ff6d00,#ff3d00); }


/* ============================================================
   🔔 Toast رسالة التنبيه
   ============================================================ */

#toast {
  position: fixed;
  bottom: -50px;
  left: 50%;
  transform: translateX(-50%);
  background: #00c853;
  color: white;
  padding: 14px 22px;
  border-radius: 14px;
  font-weight: bold;
  opacity: 0;
  transition: .5s;
  z-index: 99999;
}

#toast.show {
  bottom: 25px;
  opacity: 1;
}

</style>
</head>

<body>

<!-- شاشة البداية -->
<div id="splash">
  <div class="splash-title">قسم الحوكمة</div>
  <div class="splash-sub">ثانوية التحدي الأهلية</div>
  <div class="splash-year">العام الدراسي 2025 - 2026</div>
</div>

<header>منصة التحدي 2025-2026</header>

<!-- تسجيل الدخول -->
<div class="login-box" id="loginBox">
  <input id="studentCode" placeholder="أدخل كود الطالب أو إيميل الأستاذ">
  <button onclick="searchStudent()">تسجيل الدخول</button>
  <div id="output"></div>
</div>
<!-- صفحات الطالب -->
<div id="profilePage" class="page section"></div>
<div id="gradesPage" class="page section">لا توجد درجات حالياً</div>
<div id="notifyPage" class="page section">لا توجد تبليغات حالياً</div>
<div id="chatPage" class="page section">لا توجد رسائل حالياً</div>

<!-- صفحات الأستاذ -->
<div id="teacherClassesPage" class="page section"></div>
<div id="teacherGradesPage" class="page section"></div>

<!-- شريط التنقل السفلي للطالب -->
<div id="bottomBar">
  <div class="nav-item" onclick="showPage('profilePage', this)">الملف الشخصي</div>
  <div class="nav-item" onclick="showPage('gradesPage', this)">الدرجات</div>
  <div class="nav-item" onclick="showPage('notifyPage', this)">التبليغات</div>
  <div class="nav-item" onclick="showPage('chatPage', this)">الدردشة</div>
</div>

<!-- Toast -->
<div id="toast">تم الحفظ بنجاح ✓</div>
<script>
/* رابط السكربت (Google Apps Script) */
const API_URL = "https://script.google.com/macros/s/AKfycbwxBbM_g8dYuPF7VuPeyNTrLYcAov0YWTijVXLjpXyhLRO7skl1TuwDwkY4bezaFWBo/exec";

/* متغيرات الأستاذ */
let currentTeacher = null;
let currentTeacherClasses = [];
let currentTeacherSubject = "";
let currentTeacherClassName = "";

/* Toast */
function showToast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.background = isError ? "#e53935" : "#00c853";
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

/* الدخول التلقائي */
window.addEventListener("DOMContentLoaded", () => {
  const teacherEmail  = localStorage.getItem("teacherEmail");
  const teacherLogged = localStorage.getItem("teacherLogged");
  const savedCode     = localStorage.getItem("studentCode");
  const isLoggedIn    = localStorage.getItem("loggedIn");

  if (teacherLogged === "true" && teacherEmail) {
    document.getElementById("studentCode").value = teacherEmail;
    loginAsTeacher(teacherEmail, document.getElementById("output"), false);
    return;
  }
  if (isLoggedIn === "true" && savedCode) {
    document.getElementById("studentCode").value = savedCode;
    searchStudent(false);
  }
});

/* fixDate */
function fixDate(dateStr) {
  if (!dateStr) return "";
  dateStr = dateStr.replace(/[٠-٩]/g, d => "0123456789"["٠١٢٣٤٥٦٧٨٩".indexOf(d)]);
  let parsed = Date.parse(dateStr);
  if (!isNaN(parsed)) {
    let d = new Date(parsed);
    let yyyy = d.getFullYear();
    let mm = String(d.getMonth()+1).padStart(2,'0');
    let dd = String(d.getDate()).padStart(2,'0');
    return `${yyyy}-${mm}-${dd}`;
  }
  return "";
}

/* updateState */
async function updateState(code, state) {
  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "update_state", code, state })
  });
}

/* تسجيل الدخول طالب/أستاذ */
async function searchStudent(saveSession = true) {
  let code = document.getElementById("studentCode").value.trim();
  let output = document.getElementById("output");

  if (!code) {
    output.innerHTML = "<p class='error'>⚠️ يرجى إدخال الكود أو الإيميل</p>";
    return;
  }
  output.innerHTML = `<p style="color:white">⏳ جاري التحقق...</p>`;

  try {
    let res = await fetch(`${API_URL}?code=${encodeURIComponent(code)}`);
    let data = await res.json();

    if (data.status === "success") {
      let student = data.data;
      if (saveSession) {
        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("studentCode", code);
        updateState(code, "تم التسجيل");
      }
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("bottomBar").style.display = "flex";
      document.getElementById("bottomBar").classList.add("show-bar");

      loadProfile(student);
      loadGrades(student);
      showPage('profilePage');
      output.innerHTML = "";
      return;
    } else if (data.status === "no_match") {
      await loginAsTeacher(code, output);
      return;
    } else {
      output.innerHTML = `<p class='error'>❌ ${data.data}</p>`;
      return;
    }
  } catch (err) {
    await loginAsTeacher(code, output);
  }
}

/* تسجيل دخول أستاذ */
async function loginAsTeacher(email, outputElement, saveSession = true) {
  try {
    outputElement.innerHTML = `<p style="color:white">⏳ جاري التحقق كأستاذ...</p>`;

    let res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "get_teacher_info", email })
    });
    let data = await res.json();

    if (saveSession) {
      localStorage.setItem("teacherLogged", "true");
      localStorage.setItem("teacherEmail", email);
    }

    if (data.status !== "success") {
      outputElement.innerHTML = `<p class='error'>❌ لم يتم العثور على أستاذ بهذه البيانات</p>`;
      return;
    }

    currentTeacher        = data.data.teacher || {};
    currentTeacherClasses = data.data.classes || [];
    currentTeacherSubject = currentTeacher["اسم المادة "] ||
                            currentTeacher["اسم المادة"] || "";
    currentTeacherClassName = "";

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("bottomBar").style.display = "none";

    loadTeacherClasses();
    outputElement.innerHTML = "";
    showToast("✔ تم تسجيل دخول الأستاذ بنجاح");
  } 
  catch (err) {
    outputElement.innerHTML = `<p class="error">❌ خطأ في الاتصال</p>`;
  }
}

/* واجهة الأستاذ: قائمة الصفوف */
function loadTeacherClasses() {
  const page = document.getElementById("teacherClassesPage");

  const teacherName = currentTeacher["اسم الاستاذ"] ||
                      currentTeacher["اسم الأستاذ"] || "";
  const subject     = currentTeacher["اسم المادة "] ||
                      currentTeacher["اسم المادة"] || "";
  const email       = currentTeacher["الايميل"] ||
                      currentTeacher["الإيميل"] || "";

  let html = `
    <div class="profile-actions">
      <button onclick="teacherLogout()" class="logout-btn">🔐 خروج</button>
    </div>
    <div class="teacher-header">👨‍🏫 لوحة الأستاذ</div>
    <div class="teacher-sub">
      <div>الاسم: <b>${teacherName}</b></div>
      <div>اسم المادة : <b>${subject}</b></div>
      <div style="font-size:12px; opacity:0.9;">الإيميل: ${email}</div>
    </div>
    <div>📚 اختر الصف:</div>
    <div class="teacher-classes-grid">
  `;

  currentTeacherClasses.forEach(cls => {
    const safe = cls.replace(/'/g, "\\'");
    html += `<button class="teacher-class-btn" onclick="openTeacherClass('${safe}')">${cls}</button>`;
  });

  html += `</div>`;
  page.innerHTML = html;
  showPage("teacherClassesPage");
}

/* فتح درجات صف */
async function openTeacherClass(className) {
  const page = document.getElementById("teacherGradesPage");

  page.innerHTML = `<p style="color:#004a99;font-weight:bold;">⏳ جاري تحميل بيانات الصف...</p>`;
  showPage("teacherGradesPage");

  try {
    let res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "get_class_grades",
        className,
        subject: currentTeacherSubject
      })
    });
    let data = await res.json();

    currentTeacherClassName = className;

    if (data.status === "success") {
      renderTeacherGrades(data.data);
    } 
    else {
      page.innerHTML = `<p class="error">${data.data}</p>`;
    }

  } catch (err) {
    page.innerHTML = `<p class="error">❌ خطأ أثناء جلب البيانات</p>`;
  }
}

/* عرض جدول الدرجات للأستاذ */
function renderTeacherGrades(info) {
  const page = document.getElementById("teacherGradesPage");
  const subject = info.subject;
  const className = info.className;
  const students = info.students || [];

  let html = `
    <button class="teacher-back-btn" onclick="loadTeacherClasses()">⬅ رجوع</button>
    <div class="teacher-header">📊 درجات الطلاب</div>
    <div class="teacher-sub">
      <div>المادة: <b>${subject}</b></div>
      <div>الصف: <b>${className}</b></div>
    </div>
  `;

  if (!students.length) {
    page.innerHTML = html + `<p>⚠ لا يوجد طلاب</p>`;
    return;
  }

  html += `
    <div class="teacher-table-wrapper">
      <table id="teacherGradesTable">
        <thead>
          <tr>
            <th>#</th><th>الاسم</th>
            <th>ش1</th><th>ش2</th>
            <th>ف1</th><th>نصف</th>
            <th>ش3</th><th>ش4</th>
            <th>ف2</th><th>نهائي</th>
            <th>السعي</th><th>التقدير</th>
            <th>⚠ اعتراض</th>
          </tr>
        </thead>
        <tbody>
  `;

  students.forEach((st, index) => {
    const g = st.grades;

    html += `
      <tr data-row="${st.row}">
        <td>${index + 1}</td>
        <td>${st.name}</td>
        <td><input class="teacher-grade-input" data-key="month1" value="${g.month1}"></td>
        <td><input class="teacher-grade-input" data-key="month2" value="${g.month2}"></td>
        <td>${g.term1}</td>
        <td><input class="teacher-grade-input" data-key="mid" value="${g.mid}"></td>
        <td><input class="teacher-grade-input" data-key="month3" value="${g.month3}"></td>
        <td><input class="teacher-grade-input" data-key="month4" value="${g.month4}"></td>
        <td>${g.term2}</td>
        <td><input class="teacher-grade-input" data-key="final" value="${g.final}"></td>
        <td>${g.saay}</td>
        <td>${g.grade}</td>
        <td>${st.objection ? "❗ " + st.objection : "—"}</td>
      </tr>
    `;
  });

  html += `
        </tbody>
      </table>
    </div>
    <button class="teacher-save-btn" onclick="saveTeacherGrades()">💾 حفظ الدرجات</button>
    <button class="teacher-save-btn" onclick="downloadPDF()">📄 تحميل PDF</button>
    <button class="teacher-save-btn" style="background:#d32f2f" onclick="clearAllObjections()">🗑 حذف الاعتراضات</button>
  `;

  page.innerHTML = html;
}

/* حفظ الدرجات */
async function saveTeacherGrades() {
  const rows = document.querySelectorAll("#teacherGradesTable tbody tr");
  const grades = [];

  rows.forEach(tr => {
    const row = tr.getAttribute("data-row");
    let obj = { row };

    tr.querySelectorAll("input.teacher-grade-input").forEach(inp => {
      obj[inp.dataset.key] = inp.value;
    });

    grades.push(obj);
  });

  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "save_grades",
      subject: currentTeacherSubject,
      className: currentTeacherClassName,
      grades
    })
  });

  let data = await res.json();

  if (data.status === "success") {
    showToast("✔ تم حفظ الدرجات");
  } else {
    showToast("❌ خطأ أثناء الحفظ", true);
  }
}

/* حذف كل الاعتراضات */
async function clearAllObjections() {
  let ok = confirm("هل تريد حذف كل الاعتراضات لهذا الصف؟");
  if (!ok) return;

  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "clear_objections",
      subject: currentTeacherSubject,
      className: currentTeacherClassName
    })
  });

  let data = await res.json();
  if (data.status === "success") showToast("✔ تم حذف الاعتراضات");
  else showToast("❌ فشل حذف الاعتراضات", true);
}

/* تحميل PDF */
function downloadPDF() {
  let url = API_URL + "?action=download_pdf" +
            "&subject=" + encodeURIComponent(currentTeacherSubject) +
            "&className=" + encodeURIComponent(currentTeacherClassName);

  window.open(url, "_blank");
}

/* خروج الطالب */
function logout() {
  const code = localStorage.getItem("studentCode");
  if (code) updateState(code, "خرج");
  localStorage.removeItem("loggedIn");
  localStorage.removeItem("studentCode");
  location.reload();
}

/* خروج الأستاذ */
function teacherLogout() {
  localStorage.removeItem("teacherLogged");
  localStorage.removeItem("teacherEmail");
  location.reload();
}

/* Navigation */
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.style.display = "none");
  document.getElementById(id).style.display = "block";
}

/* =========================
   Ripple Effect للموجة
========================= */
document.addEventListener("click", function(e) {
  if (e.target.tagName.toLowerCase() === "button") {
    const btn = e.target;

    const circle = document.createElement("span");
    circle.classList.add("ripple");

    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);

    circle.style.width  = size + "px";
    circle.style.height = size + "px";
    circle.style.left   = (e.clientX - rect.left - size/2) + "px";
    circle.style.top    = (e.clientY - rect.top - size/2) + "px";

    btn.appendChild(circle);

    setTimeout(() => circle.remove(), 600);
  }
});
</script>
