<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول الطالب</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

body {
  font-family: 'Cairo', sans-serif;
  direction: rtl;
  margin: 0;
  padding: 0;
  background: linear-gradient(to bottom, #007bff, #6a0dad, #ffffff);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-container {
  background: #fff;
  padding: 30px 25px;
  border-radius: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  width: 100%;
  max-width: 400px;
}

.login-container h2 {
  text-align: center;
  margin-bottom: 25px;
  color: #333;
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.input-group input {
  padding: 12px;
  font-size: 14px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.input-group input:focus {
  outline: none;
  border-color: #007bff;
  box-shadow: 0 0 8px rgba(0,123,255,0.3);
}

button {
  padding: 10px 20px;
  font-size: 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
  width: 100%;
  margin-top: 10px;
}

#loginBtn {
  background: #28a745;
  color: #fff;
}

#loginBtn:hover {
  background: #218838;
  transform: scale(1.05);
}

#whatsappBtn {
  background: #25D366;
  color: #fff;
}

#whatsappBtn:hover {
  background: #1ebe57;
  transform: scale(1.05);
}

.message {
  text-align: center;
  margin-top: 10px;
  color: #dc3545;
  min-height: 20px;
}

</style>
</head>
<body>

<div class="login-container">
  <h2>تسجيل دخول الطالب</h2>
  <div class="input-group">
    <input id="parentNumber" placeholder="أدخل رقم ولي الأمر">
    <input id="studentCode" placeholder="أدخل كود الطالب">
  </div>
  <button id="loginBtn" onclick="login()">تسجيل الدخول</button>
  <button id="whatsappBtn" onclick="openWhatsApp()">الدعم السريع واتساب</button>
  <div class="message" id="message"></div>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwimKjV1uHCxq1DLUQ_hJguMjB4Xi6hw9OGxrlMWheHGhNRzCDLySvnIFBX9-2bQCXo/exec"; // ضع الرابط هنا

function normalize(num){
  return num.replace(/^0/, "");
}

function openWhatsApp() {
  window.open("https://wsend.co/9647851521585", "_blank");
}

async function login() {
  const rawParent = document.getElementById("parentNumber").value.trim();
  const code      = document.getElementById("studentCode").value.trim();
  const msg       = document.getElementById("message");

  if (!rawParent || !code) {
    msg.textContent = "⚠️ الرجاء إدخال جميع الحقول";
    return;
  }

  const parent = normalize(rawParent);
  msg.textContent = "⏳ جاري التحقق...";

  const body = new URLSearchParams({
    action: "check",
    parent: parent,
    code: code
  });

  try {
    const res = await fetch(SHEET_URL, {
      method: "POST",
      headers: {"Content-Type":"application/x-www-form-urlencoded"},
      body: body.toString()
    });

    const data = await res.json();

    if (data.valid) {
      localStorage.setItem("parentNumber", parent);
      localStorage.setItem("studentCode", code);

      msg.style.color = "#28a745";
      msg.textContent = "✅ تسجيل الدخول ناجح";

      setTimeout(()=>{ window.location.href = "main.html"; }, 1000);

    } else {
      msg.textContent = "❌ بيانات خاطئة";
    }

  } catch (err) {
    msg.textContent = "⚠️ خطأ أثناء الاتصال";
  }
}

window.onload = ()=>{
  const p = localStorage.getItem("parentNumber");
  const c = localStorage.getItem("studentCode");
  if (p && c) window.location.href = "main.html";
};
</script>

</body>
</html>
