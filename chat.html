<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحادثة مع الإدارة</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

body{
  font-family:'Cairo',sans-serif;
  direction:rtl;
  margin:0;
  padding:0;
  background:#f6f6f6;
}

.header{
  background:#007bff;
  color:#fff;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.chat-box{
  max-width:700px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  height:500px;
  overflow-y:auto;
  box-shadow:0 5px 25px rgba(0,0,0,0.1);
}

.message{
  margin-bottom:15px;
  padding:12px;
  background:#e3e3e3;
  border-radius:10px;
  width:fit-content;
  max-width:75%;
}

.my-msg{
  background:#d1ffd6;
  margin-right:auto;
}

.input-area{
  max-width:700px;
  margin:10px auto;
  display:flex;
  gap:10px;
}

input{
  flex:1;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:12px 20px;
  background:#007bff;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#005ec4;
}
</style>
</head>
<body>

<div class="header">💬 محادثة مع إدارة المدرسة</div>

<div class="chat-box" id="chatBox">
  ⏳ جاري تحميل الرسائل...
</div>

<div class="input-area">
  <input id="msgInput" placeholder="اكتب رسالتك هنا...">
  <button onclick="sendMessage()">إرسال</button>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwimKjV1uHCxq1DLUQ_hJguMjB4Xi6hw9OGxrlMWheHGhNRzCDLySvnIFBX9-2bQCXo/exec";

// normalize مثل باقي الصفحات
function normalize(v){
  v = String(v||"").trim();
  v = v.replace(/\s+/g,"");
  if(v.startsWith("0")) v = v.substring(1);
  return v;
}

// تحميل الرسائل من السيرفر
async function loadMessages(){
  const rawParent = localStorage.getItem("parentNumber");
  const rawCode   = localStorage.getItem("studentCode");
  const box = document.getElementById("chatBox");

  if(!rawParent || !rawCode){
    box.textContent = "⛔ الجلسة منتهية، سيتم تحويلك...";
    setTimeout(()=>{ window.location.href="index.html"; },1200);
    return;
  }

  const parent = normalize(rawParent);
  const code   = normalize(rawCode);

  // طلب الرسائل (سيعمل بعد إضافة action=loadChat في السكربت)
  const body = new URLSearchParams({
    action:"loadChat",
    parent:parent,
    code:code
  });

  try{
    const res = await fetch(SHEET_URL,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:body.toString()
    });

    const data = await res.json();

    if(!data.success){
      box.innerHTML = "💬 لا توجد رسائل بعد.";
      return;
    }

    const messages = data.messages || [];
    let html = "";

    messages.forEach(msg=>{
      if(msg.from === "parent"){
        html += `<div class="message my-msg">${msg.text}</div>`;
      }else{
        html += `<div class="message">${msg.text}</div>`;
      }
    });

    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;

  }catch(err){
    box.innerHTML = "⚠️ خطأ أثناء تحميل الرسائل.";
  }
}

// إرسال رسالة
async function sendMessage(){
  const text = document.getElementById("msgInput").value.trim();
  const box  = document.getElementById("chatBox");

  if(!text){
    return;
  }

  const rawParent = localStorage.getItem("parentNumber");
  const rawCode   = localStorage.getItem("studentCode");

  const parent = normalize(rawParent);
  const code   = normalize(rawCode);

  const body = new URLSearchParams({
    action:"sendChat",
    parent:parent,
    code:code,
    text:text
  });

  try{
    const res = await fetch(SHEET_URL,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:body.toString()
    });

    const data = await res.json();
    console.log(data);

    if(data.success){
      document.getElementById("msgInput").value = "";

      // أضف الرسالة فوراً بدون انتظار السيرفر
      box.innerHTML += `<div class="message my-msg">${text}</div>`;
      box.scrollTop = box.scrollHeight;

    }else{
      alert("تعذر إرسال الرسالة");
    }

  }catch(err){
    alert("⚠️ خطأ أثناء إرسال الرسالة");
  }
}

window.onload = loadMessages;
</script>

</body>
</html>
