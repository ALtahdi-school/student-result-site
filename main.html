<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>واجهة التطبيق - GSAP متطور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  body {
    font-family: 'Cairo', sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: #f0f2f5;
    overflow-x: hidden;
  }

  .content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    color: #fff;
    width: 100%;
    height: calc(100vh - 80px);
    position: absolute;
    top: 0;
    left: 0;
    opacity: 0;
    transform: translateY(30px);
    background: linear-gradient(135deg, #6a0dad, #007bff);
  }

  .bottom-bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    height: 80px;
    background: #fff;
    color: #333;
    position: sticky;
    bottom: 0;
    width: 100%;
    box-shadow: 0 -6px 18px rgba(0,0,0,0.15);
    z-index: 100;
  }

  .bar-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    cursor: pointer;
    padding: 10px 0;
    font-weight: 600;
    user-select: none;
    font-size: 14px;
    color: #666;
  }

  .bar-item svg {
    width: 24px;
    height: 24px;
    margin-bottom: 4px;
    fill: #666;
    opacity: 0;
    transform: translateY(10px);
  }

  .bar-item.active svg {
    fill: #ff5722;
  }

  .bar-item.active {
    color: #ff5722;
  }

  .bar-item span {
    opacity: 0;
    transform: translateY(10px);
  }

  .bar-item.active span {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>

<div id="pageAccount" class="content">صفحة الحساب</div>
<div id="pageGrades" class="content">صفحة الدرجات</div>
<div id="pageChat" class="content">صفحة الدردشة</div>
<div id="pageNotifications" class="content">صفحة التبليغات</div>

<div class="bottom-bar">
  <div class="bar-item active" data-target="pageAccount">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    <span>الحساب</span>
  </div>
  <div class="bar-item" data-target="pageGrades">
    <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zm0-8h14V7H7v2z"/></svg>
    <span>الدرجات</span>
  </div>
  <div class="bar-item" data-target="pageChat">
    <svg viewBox="0 0 24 24"><path d="M21 6h-2v9H5v2h14l4 4V6z"/></svg>
    <span>الدردشة</span>
  </div>
  <div class="bar-item" data-target="pageNotifications">
    <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6V9c0-3.07-1.63-5.64-4.5-6.32V2h-3v.68C7.63 3.36 6 5.92 6 9v7l-2 2v1h16v-1l-2-2z"/></svg>
    <span>التبليغات</span>
  </div>
</div>

<script>
const items = document.querySelectorAll('.bar-item');
const pages = document.querySelectorAll('.content');
let currentPage = document.getElementById('pageAccount');

// اظهار الصفحة الاولى
gsap.to(currentPage, {duration: 0.8, opacity: 1, y: 0, ease: "power3.out"});

// مخفي الباقي
pages.forEach(p => { if(p!==currentPage) p.style.display='none'; });

items.forEach(item => {
  item.addEventListener('click', () => {
    const targetId = item.getAttribute('data-target');
    const targetPage = document.getElementById(targetId);
    if (targetPage === currentPage) return;

    // تحديث البار السفلي
    items.forEach(i => i.classList.remove('active'));
    item.classList.add('active');

    // تغيير الخلفية تدريجيًا
    gsap.to(currentPage, {duration:0.5, opacity:0, y:20, ease:"power2.inOut", onComplete:()=>{
      currentPage.style.display='none';
      targetPage.style.display='flex';
      gsap.fromTo(targetPage, 
        {opacity:0, y:30, background:'#6a0dad'}, 
        {duration:0.8, opacity:1, y:0, background:'#007bff', ease:"power3.out"}
      );
      currentPage = targetPage;
    }});

    // انميشن الايقونة والنص
    const svg = item.querySelector('svg');
    const span = item.querySelector('span');
    gsap.fromTo(svg, {opacity:0, y:10}, {opacity:1, y:0, duration:0.5, ease:"back.out(1.7)"});
    gsap.fromTo(span, {opacity:0, y:10}, {opacity:1, y:0, duration:0.5, delay:0.1, ease:"back.out(1.7)"});
  });
});
</script>

</body>
</html>
