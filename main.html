<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيانات الطالب</title>

<style>
body{
  font-family:'Cairo',sans-serif;
  direction:rtl;
  background:#f6f6f6;
  margin:0;
  padding:0;
}

.header{
  background:#007bff;
  padding:15px;
  text-align:center;
  font-size:22px;
  color:#fff;
  font-weight:bold;
}

.container{
  max-width:700px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

.logout-btn{
  background:#dc3545;
  color:#fff;
  padding:10px;
  border:none;
  border-radius:8px;
  width:100%;
  cursor:pointer;
  font-size:16px;
}
</style>

</head>
<body>

<div class="header">📘 بيانات الطالب</div>

<div class="container">
  <div id="info">⏳ جاري تحميل البيانات...</div>
  <br>
  <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
</div>

<script>
const SHEET_URL = "YOUR_SCRIPT_URL_HERE";  // ضع رابط السكربت هنا

function normalize(v){
  v = String(v||"").trim();
  v = v.replace(/\s+/g,"");
  if(v.startsWith("0")) v = v.substring(1);
  return v;
}

async function loadData(){
  const rawParent = localStorage.getItem("parentNumber");
  const rawCode   = localStorage.getItem("studentCode");
  const box       = document.getElementById("info");

  if(!rawParent || !rawCode){
    box.textContent="⛔ انتهت الجلسة. سيتم تحويلك...";
    setTimeout(()=>{ window.location.href="index.html"; },1200);
    return;
  }

  const parent = normalize(rawParent);
  const code   = normalize(rawCode);

  const body = new URLSearchParams({
    action:"getStudent",
    parent:parent,
    code:code
  });

  try{
    const res = await fetch(SHEET_URL,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:body.toString()
    });

    const data = await res.json();

    if(!data.student){
      box.textContent="⛔ لا يمكن التحقق من الحساب. سيتم تحويلك...";
      setTimeout(()=>{ window.location.href="index.html"; },1500);
      return;
    }

    const student = data.student;
    let html = "";

    for(let k in student){
      html += `<b>${k}:</b> ${student[k]}<br>`;
    }

    box.innerHTML = html;

  }catch(err){
    box.textContent="⚠️ خطأ أثناء جلب البيانات.";
  }
}

function logout(){
  localStorage.clear();
  window.location.href="index.html";
}

window.onload = loadData;
</script>

</body>
</html>
