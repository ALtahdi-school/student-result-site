<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحساب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family:'Cairo',sans-serif; direction:rtl; background:#f6f6f6; margin:0; padding:0;}
.section{margin:20px;padding:20px;background:#fff;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,0.08);}
.section h3{border-bottom:2px solid #007bff;padding-bottom:5px;}
.info-row{display:flex;flex-wrap:wrap;margin-bottom:12px;}
.info-label{flex:1 1 40%;font-weight:600;color:#555;}
.info-value{flex:1 1 55%;}
input[type=text]{width:100%;padding:5px;border-radius:5px;border:1px solid #ccc;}
button{padding:10px 20px;margin:10px;border:none;border-radius:8px;background:#007bff;color:#fff;cursor:pointer;}
button:hover{background:#0056b3;}
</style>
</head>
<body>

<div class="section" id="generalInfo">
<h3>المعلومات العامة</h3>
<div class="info-row"><div class="info-label">رقم ولي الأمر:</div><div class="info-value"><input type="text" id="parentNumber"></div></div>
<div class="info-row"><div class="info-label">رقم الطالب:</div><div class="info-value"><input type="text" id="studentNumber"></div></div>
<div class="info-row"><div class="info-label">رقم الخط:</div><div class="info-value"><input type="text" id="lineNumber"></div></div>
<div class="info-row"><div class="info-label">العنوان:</div><div class="info-value"><input type="text" id="address"></div></div>
<div class="info-row"><div class="info-label">المدرسة القادمة منها:</div><div class="info-value"><input type="text" id="previousSchool"></div></div>
<div class="info-row"><div class="info-label">اسم الأم:</div><div class="info-value"><input type="text" id="motherName"></div></div>
</div>

<div class="section" id="otherInfo">
<h3>المعلومات الأخرى</h3>
<div class="info-row"><div class="info-label">اسم الطالب:</div><div class="info-value" id="studentName"></div></div>
<div class="info-row"><div class="info-label">الصف:</div><div class="info-value" id="grade"></div></div>
<div class="info-row"><div class="info-label">القاعة:</div><div class="info-value" id="classRoom"></div></div>
<div class="info-row"><div class="info-label">الجنس:</div><div class="info-value" id="gender"></div></div>
<!-- أضف باقي الحقول هنا حسب الحاجة -->
</div>

<div style="text-align:center;">
<button id="saveBtn">حفظ التغييرات</button>
<button id="logoutBtn">تسجيل الخروج</button>
</div>

<script>
const GAS_URL = "ضع هنا رابط Google Apps Script";
const studentCode = localStorage.getItem("studentCode");
const parentNumberLS = localStorage.getItem("parentNumber");

if(!studentCode || !parentNumberLS){
    alert("الرجاء تسجيل الدخول أولاً"); window.location.href="index.html";
} else {
    fetch(`${GAS_URL}?action=get&code=${studentCode}&parent=${parentNumberLS}`)
    .then(r=>r.json())
    .then(data=>{
        if(!data.valid){ alert("لم يتم العثور على بيانات الطالب"); return; }
        const s = data.student;
        // حقول قابلة للتعديل
        document.getElementById("parentNumber").value = s["رقم ولي الامر"];
        document.getElementById("studentNumber").value = s["رقم الطالب"];
        document.getElementById("lineNumber").value = s["رقم الخط"];
        document.getElementById("address").value = s["العنوان"];
        document.getElementById("previousSchool").value = s["المدرسة القادم منها"];
        document.getElementById("motherName").value = s["اسم الام"];
        // باقي البيانات للعرض فقط
        document.getElementById("studentName").textContent = s["اسم الطالب"];
        document.getElementById("grade").textContent = s["الصف"];
        document.getElementById("classRoom").textContent = s["القاعة"];
        document.getElementById("gender").textContent = s["الجنس"];
    });
}

document.getElementById("saveBtn").onclick = ()=>{
    const fields = {
        "رقم ولي الامر": document.getElementById("parentNumber").value,
        "رقم الطالب": document.getElementById("studentNumber").value,
        "رقم الخط": document.getElementById("lineNumber").value,
        "العنوان": document.getElementById("address").value,
        "المدرسة القادم منها": document.getElementById("previousSchool").value,
        "اسم الام": document.getElementById("motherName").value
    };
    fetch(GAS_URL,{
        method:"POST",
        body: JSON.stringify({action:"update", code:studentCode, parent:parentNumberLS, fields}),
        headers: {"Content-Type":"application/json"}
    }).then(r=>r.json()).then(d=>{
        if(d.success){ alert("تم حفظ التغييرات بنجاح"); } else { alert("حدث خطأ"); }
    });
};

document.getElementById("logoutBtn").onclick = ()=>{
    fetch(GAS_URL,{
        method:"POST",
        body: JSON.stringify({action:"logout", code:studentCode, parent:parentNumberLS}),
        headers: {"Content-Type":"application/json"}
    }).then(r=>r.json()).then(d=>{
        localStorage.clear();
        window.location.href="index.html";
    });
};
</script>

</body>
</html>
