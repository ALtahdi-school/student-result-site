<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحساب الشخصي</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

body {
  font-family: 'Cairo', sans-serif;
  direction: rtl;
  margin: 0;
  padding: 0;
  background: #f0f2f5;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  background: #fff;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

button.logoutBtn {
  background: #dc3545;
  border: none;
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  transition: all 0.3s ease;
  display: block;
  margin: 20px auto;
}
button.logoutBtn:hover {
  background: #c82333;
  transform: scale(1.05);
}

h3 {
  margin-top: 0;
  margin-bottom: 20px;
  color: #333;
  text-align: center;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 30px;
}

table td {
  padding: 10px;
  border: 1px solid #ccc;
}

table td.label {
  font-weight: bold;
  background: #f8f9fa;
  width: 30%;
}

@media (max-width: 600px) {
  table td {
    display: block;
    width: 100%;
  }
  table td.label {
    width: 100%;
  }
}
</style>
</head>
<body>

<div class="container">
  <h3>المعلومات العامة</h3>
  <table id="generalInfo"></table>
</div>

<div class="container">
  <button class="logoutBtn" onclick="logout()">تسجيل الخروج</button>
</div>

<div class="container">
  <h3>المعلومات المالية</h3>
  <table id="financialInfo"></table>
</div>

<script>
// رابط Google Apps Script النهائي
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwimKjV1uHCxq1DLUQ_hJguMjB4Xi6hw9OGxrlMWheHGhNRzCDLySvnIFBX9-2bQCXo/exec";

// الحصول على المعلمات من الرابط (إن وُجدت)
const urlParams = new URLSearchParams(window.location.search);
const parentNumber = urlParams.get('parent') || "";
const studentCode = urlParams.get('code') || "";

// تحميل بيانات الطالب
async function loadStudentData() {
  try {
    const query = `?action=getStudent&parent=${encodeURIComponent(parentNumber)}&code=${encodeURIComponent(studentCode)}`;
    const response = await fetch(SHEET_URL + query);
    const data = await response.json();

    if (!data || !data.student) {
      console.warn("⚠️ لم يتم العثور على بيانات الطالب، تحقق من Google Sheet أو الرابط.");
      return;
    }

    const studentData = data.student;

    // قسم المعلومات العامة
    const generalFields = [
      "id","اسم الطالب","الصف","القاعة","الجنس","رقم ولي الامر","رقم الخط",
      "الملاحظات","الكتب","العنوان","اسم الام","المدرسة القادم منها","المعدل في الصف السابق"
    ];
    const generalTable = document.getElementById("generalInfo");
    generalFields.forEach(field => {
      const row = document.createElement("tr");
      const label = document.createElement("td");
      label.textContent = field;
      label.className = "label";
      const value = document.createElement("td");
      value.textContent = studentData[field] || "";
      row.appendChild(label);
      row.appendChild(value);
      generalTable.appendChild(row);
    });

    // قسم المعلومات المالية
    const financialFields = [
      "القسط 1","تاريخ 1","القسط 2","تاريخ 2","القسط 3","تاريخ 3",
      "القسط 4","تاريخ 4","القسط 5","تاريخ 5","القسط 6","تاريخ 6",
      "القسط 7","تاريخ 7","القسط 8","تاريخ 8",
      "الباقي الكلي","المبلغ الكلي","الواصل الكلي","الكفالة","مبلغ الكفالة"
    ];
    const financialTable = document.getElementById("financialInfo");
    financialFields.forEach(field => {
      const row = document.createElement("tr");
      const label = document.createElement("td");
      label.textContent = field;
      label.className = "label";
      const value = document.createElement("td");
      value.textContent = studentData[field] || "";
      row.appendChild(label);
      row.appendChild(value);
      financialTable.appendChild(row);
    });

  } catch (error) {
    console.error("حدث خطأ أثناء تحميل البيانات:", error);
  }
}

// زر تسجيل الخروج (بدون مسح الجلسة)
function logout() {
  window.location.href = "index.html";
}

window.addEventListener("DOMContentLoaded", loadStudentData);
</script>

</body>
</html>
