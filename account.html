<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة حساب الطالب</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

body{
  font-family:'Cairo',sans-serif;
  direction:rtl;
  margin:0;
  padding:0;
  background:#f6f6f6;
}

.header{
  background:#007bff;
  color:#fff;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.container{
  max-width:550px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:12px;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  background:#28a745;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
  margin-top:20px;
  cursor:pointer;
}

button:hover{
  background:#218838;
}

.logout{
  background:#dc3545 !important;
}

.msg{
  margin-top:15px;
  white-space:pre-line;
  text-align:center;
  min-height:25px;
}
</style>
</head>
<body>

<div class="header">👤 حساب الطالب</div>

<div class="container">

  <h2>تعديل معلومات الحساب</h2>

  <label>رقم ولي الأمر</label>
  <input id="newParent" placeholder="رقم ولي الأمر الجديد">

  <label>رقم الخط</label>
  <input id="newLine" placeholder="رقم الخط الجديد">

  <label>العنوان</label>
  <input id="newAddress" placeholder="عنوان الطالب">

  <label>رقم الطالب</label>
  <input id="newStudentNumber" placeholder="الرقم المدرسي للطالب">

  <label>المدرسة القادم منها</label>
  <input id="newSchoolFrom" placeholder="اكتب اسم المدرسة">

  <button onclick="updateData()">حفظ التعديلات</button>
  <button class="logout" onclick="logout()">تسجيل الخروج</button>

  <div class="msg" id="msg"></div>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwimKjV1uHCxq1DLUQ_hJguMjB4Xi6hw9OGxrlMWheHGhNRzCDLySvnIFBX9-2bQCXo/exec";

function normalize(v){
  v = String(v||"").trim();
  v = v.replace(/\s+/g,"");
  if(v.startsWith("0")) v = v.substring(1);
  return v;
}

// تحديث البيانات
async function updateData(){
  const msg = document.getElementById("msg");

  const rawParent = localStorage.getItem("parentNumber");
  const rawCode   = localStorage.getItem("studentCode");

  if(!rawParent || !rawCode){
    msg.style.color="#dc3545";
    msg.textContent="⛔ انتهت الجلسة. سيتم الرجوع...";
    setTimeout(()=>{ window.location.href="index.html"; },1000);
    return;
  }

  const parent = normalize(rawParent);
  const code   = normalize(rawCode);

  const body = new URLSearchParams({
    action:"updateStudent",
    parent: parent,
    code: code,
    newParent: document.getElementById("newParent").value.trim(),
    newLine: document.getElementById("newLine").value.trim(),
    newAddress: document.getElementById("newAddress").value.trim(),
    newStudentNumber: document.getElementById("newStudentNumber").value.trim(),
    newSchoolFrom: document.getElementById("newSchoolFrom").value.trim()
  });

  msg.style.color="#333";
  msg.textContent="⏳ جاري تحديث البيانات...";

  try{
    const res = await fetch(SHEET_URL,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:body.toString()
    });

    const data = await res.json();
    console.log(data);

    if(data.success){
      msg.style.color="#28a745";
      msg.textContent="✔ تم تحديث البيانات بنجاح.";
    } else {
      msg.style.color="#dc3545";
      msg.textContent = data.message || "❌ لم يتم تحديث البيانات.";
    }

  }catch(err){
    msg.style.color="#dc3545";
    msg.textContent="⚠️ خطأ أثناء الاتصال بالسيرفر.";
  }
}

async function logout(){
  localStorage.clear();
  window.location.href="index.html";
}
</script>

</body>
</html>
