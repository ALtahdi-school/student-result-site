<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحساب الشخصي</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

body {
  font-family: 'Cairo', sans-serif;
  direction: rtl;
  margin: 0;
  padding: 0;
  background: #f0f2f5;
}

.top-bar {
  background: #007bff;
  color: #fff;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.top-bar h2 {
  margin: 0;
  font-size: 18px;
}

button.logoutBtn {
  background: #dc3545;
  border: none;
  color: #fff;
  padding: 8px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s ease;
  margin: 20px auto;
  display: block;
}

button.logoutBtn:hover {
  background: #c82333;
  transform: scale(1.05);
}

.container {
  max-width: 900px;
  margin: 30px auto;
  background: #fff;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h3 {
  margin-top: 0;
  margin-bottom: 20px;
  color: #333;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 30px;
}

table td {
  padding: 10px;
  border: 1px solid #ccc;
}

table td.label {
  font-weight: bold;
  background: #f8f9fa;
  width: 30%;
}

@media (max-width: 600px) {
  table td {
    display: block;
    width: 100%;
  }
  table td.label {
    width: 100%;
  }
}
</style>
</head>
<body>

<div class="top-bar">
  <h2 id="studentName">مرحبا، الطالب</h2>
</div>

<div class="container">
  <h3>المعلومات العامة</h3>
  <table id="generalInfo"></table>
</div>

<!-- زر تسجيل الخروج بين الأقسام -->
<div class="container">
  <button class="logoutBtn" onclick="logout()">تسجيل الخروج</button>
</div>

<div class="container">
  <h3>المعلومات المالية</h3>
  <table id="financialInfo"></table>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/YOUR_DEPLOYED_WEBAPP_URL/exec"; // ضع رابط Web App النهائي هنا

window.addEventListener("DOMContentLoaded", () => {
  const studentData = JSON.parse(localStorage.getItem("studentData") || "{}");
  if (!studentData || Object.keys(studentData).length === 0) {
    alert("لا توجد بيانات متاحة، الرجاء تسجيل الدخول.");
    window.location.href = "index.html";
    return;
  }

  document.getElementById("studentName").textContent = `مرحبا، ${studentData["اسم الطالب"]}`;

  // قسم المعلومات العامة
  const generalFields = [
    "id","اسم الطالب","الصف","القاعة","الجنس","رقم ولي الامر","رقم الخط",
    "الملاحظات","الكتب","العنوان","اسم الام","المدرسة القادم منها","المعدل في الصف السابق"
  ];
  const generalTable = document.getElementById("generalInfo");
  generalFields.forEach(field => {
    const row = document.createElement("tr");
    const cellLabel = document.createElement("td"); cellLabel.textContent = field; cellLabel.className = "label";
    const cellValue = document.createElement("td"); cellValue.textContent = studentData[field] || "";
    row.appendChild(cellLabel); row.appendChild(cellValue);
    generalTable.appendChild(row);
  });

  // قسم المعلومات المالية
  const financialFields = [
    "القسط 1","تاريخ 1","القسط 2","تاريخ 2","القسط 3","تاريخ 3",
    "القسط 4","تاريخ 4","القسط 5","تاريخ 5","القسط 6","تاريخ 6",
    "القسط 7","تاريخ 7","القسط 8","تاريخ 8",
    "الباقي الكلي","المبلغ الكلي","الواصل الكلي","الكفالة","مبلغ الكفالة"
  ];
  const financialTable = document.getElementById("financialInfo");
  financialFields.forEach(field => {
    const row = document.createElement("tr");
    const cellLabel = document.createElement("td"); cellLabel.textContent = field; cellLabel.className = "label";
    const cellValue = document.createElement("td"); cellValue.textContent = studentData[field] || "";
    row.appendChild(cellLabel); row.appendChild(cellValue);
    financialTable.appendChild(row);
  });
});

// دالة تسجيل الخروج
async function logout() {
  const studentData = JSON.parse(localStorage.getItem("studentData") || "{}");
  if (!studentData) { window.location.href = "index.html"; return; }

  const parent = studentData["رقم ولي الامر"];
  const code = studentData["كود الطالب"];

  try {
    await fetch(`${SHEET_URL}?action=logout&parent=${encodeURIComponent(parent)}&code=${encodeURIComponent(code)}`, { method: "POST" });
  } catch (err) {
    console.error(err);
  }

  localStorage.clear(); // مسح جميع الجلسات
  window.location.href = "index.html"; // العودة إلى صفحة تسجيل الدخول
}
</script>

</body>
</html>
