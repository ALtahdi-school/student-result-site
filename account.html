<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحساب الشخصي</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

body {
  font-family: 'Cairo', sans-serif;
  direction: rtl;
  margin: 0;
  padding: 0;
  background: #f0f2f5;
}

button.logoutBtn {
  background: #dc3545;
  border: none;
  color: #fff;
  padding: 8px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s ease;
  margin: 20px auto;
  display: block;
}

button.logoutBtn:hover {
  background: #c82333;
  transform: scale(1.05);
}

.container {
  max-width: 900px;
  margin: 30px auto;
  background: #fff;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h3 {
  margin-top: 0;
  margin-bottom: 20px;
  color: #333;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 30px;
}

table td {
  padding: 10px;
  border: 1px solid #ccc;
}

table td.label {
  font-weight: bold;
  background: #f8f9fa;
  width: 30%;
}

@media (max-width: 600px) {
  table td {
    display: block;
    width: 100%;
  }
  table td.label {
    width: 100%;
  }
}
</style>
</head>
<body>

<div class="container">
  <h3>المعلومات العامة</h3>
  <table id="generalInfo"></table>
</div>

<div class="container">
  <button class="logoutBtn" onclick="logout()">تسجيل الخروج</button>
</div>

<div class="container">
  <h3>المعلومات المالية</h3>
  <table id="financialInfo"></table>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/YOUR_DEPLOYED_WEBAPP_URL/exec"; // ضع رابط Web App هنا

// تمرير parentNumber و studentCode عبر query string
const urlParams = new URLSearchParams(window.location.search);
const parentNumber = urlParams.get('parent');
const studentCode = urlParams.get('code');

if (!parentNumber || !studentCode) {
  window.location.href = "index.html";
}

async function loadStudentData() {
  try {
    const resp = await fetch(`${SHEET_URL}?action=getStudent&parent=${encodeURIComponent(parentNumber)}&code=${encodeURIComponent(studentCode)}`);
    const data = await resp.json();
    
    if (!data || !data.valid) {
      window.location.href = "index.html";
      return;
    }

    const studentData = data.student;

    // قسم المعلومات العامة
    const generalFields = [
      "id","اسم الطالب","الصف","القاعة","الجنس","رقم ولي الامر","رقم الخط",
      "الملاحظات","الكتب","العنوان","اسم الام","المدرسة القادم منها","المعدل في الصف السابق"
    ];
    const generalTable = document.getElementById("generalInfo");
    generalFields.forEach(field => {
      const row = document.createElement("tr");
      const cellLabel = document.createElement("td"); cellLabel.textContent = field; cellLabel.className = "label";
      const cellValue = document.createElement("td"); cellValue.textContent = studentData[field] || "";
      row.appendChild(cellLabel); row.appendChild(cellValue);
      generalTable.appendChild(row);
    });

    // قسم المعلومات المالية
    const financialFields = [
      "القسط 1","تاريخ 1","القسط 2","تاريخ 2","القسط 3","تاريخ 3",
      "القسط 4","تاريخ 4","القسط 5","تاريخ 5","القسط 6","تاريخ 6",
      "القسط 7","تاريخ 7","القسط 8","تاريخ 8",
      "الباقي الكلي","المبلغ الكلي","الواصل الكلي","الكفالة","مبلغ الكفالة"
    ];
    const financialTable = document.getElementById("financialInfo");
    financialFields.forEach(field => {
      const row = document.createElement("tr");
      const cellLabel = document.createElement("td"); cellLabel.textContent = field; cellLabel.className = "label";
      const cellValue = document.createElement("td"); cellValue.textContent = studentData[field] || "";
      row.appendChild(cellLabel); row.appendChild(cellValue);
      financialTable.appendChild(row);
    });

  } catch (err) {
    console.error(err);
  }
}

// زر تسجيل الخروج
function logout() {
  window.location.href = "index.html";
}

window.addEventListener("DOMContentLoaded", loadStudentData);
</script>

</body>
</html>
