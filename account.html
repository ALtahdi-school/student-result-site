<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحساب الشخصي</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cairo', sans-serif;
  direction:rtl;
  background:#f0f2f5;
}

.container{
  max-width:900px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h3{
  margin-top:0;
  text-align:center;
  color:#333;
  font-size:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:20px;
}

td{
  padding:10px;
  border:1px solid #ccc;
  font-size:14px;
}

td.label{
  font-weight:bold;
  background:#f7f7f7;
  width:30%;
}

input.edit-input{
  width:100%;
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
  font-family:inherit;
}

/* زر الحفظ */
.saveBtn {
  background:#007bff;
  color:#fff;
  padding:10px 20px;
  border:none;
  font-size:14px;
  border-radius:8px;
  cursor:pointer;
  display:block;
  margin:10px auto;
  transition:0.3s;
}
.saveBtn:hover{
  background:#0069d9;
  transform:scale(1.05);
}

/* تسجيل الخروج */
.logoutBtn{
  background:#dc3545;
  color:#fff;
  padding:10px 20px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
  display:block;
  margin:20px auto;
  transition:0.3s;
}
.logoutBtn:hover{
  background:#c82333;
  transform:scale(1.05);
}

/* شريط أسفل */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  height:60px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #ccc;
}
.bottom-nav a{
  text-decoration:none;
  color:#777;
  font-size:13px;
  font-weight:bold;
}
.bottom-nav a.active{
  color:#007bff;
}
</style>
</head>

<body>

<div class="container">
  <h3>المعلومات الشخصية</h3>
  <table id="generalInfo"></table>

  <button class="saveBtn" onclick="saveData()">💾 حفظ التغييرات</button>
  <button class="logoutBtn" onclick="logout()">تسجيل الخروج</button>
</div>

<!-- البار السفلي -->
<nav class="bottom-nav">
  <a href="account.html" class="active">الحساب</a>
  <a href="grades.html">الدرجات</a>
  <a href="chat.html">الدردشة</a>
  <a href="notifications.html">التبليغات</a>
</nav>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwimKjV1uHCxq1DLUQ_hJguMjB4Xi6hw9OGxrlMWheHGhNRzCDLySvnIFBX9-2bQCXo/exec"; // ضع الرابط هنا

const parentNumber = localStorage.getItem("parentNumber");
const studentCode = localStorage.getItem("studentCode");

if(!parentNumber || !studentCode){
  window.location.href = "index.html";
}

let studentData = null;

// تحميل بيانات الطالب
async function loadStudent(){
  const res = await fetch(SHEET_URL + "?action=getStudent&parent=" + parentNumber + "&code=" + studentCode);
  const data = await res.json();

  if(!data.student){
    alert("خطأ: لم يتم العثور على بيانات.");
    return;
  }

  studentData = data.student;

  const fields = [
    "id","اسم الطالب","الصف","القاعة","الجنس","رقم ولي الامر",
    "رقم الخط","الملاحظات","كود الطالب","الكتب","العنوان",
    "اسم الام","المدرسة القادم منها","المعدل في الصف السابق","رقم الطالب"
  ];

  const editable = ["رقم ولي الامر","رقم الخط","العنوان","المدرسة القادم منها","رقم الطالب"];

  const table = document.getElementById("generalInfo");

  fields.forEach(f=>{
    const tr = document.createElement("tr");
    const td1 = document.createElement("td");
    td1.className = "label";
    td1.textContent = f;

    const td2 = document.createElement("td");

    if(editable.includes(f)){
      td2.innerHTML = `<input class="edit-input" id="edit_${f}" value="${studentData[f] || ""}">`;
    } else {
      td2.textContent = studentData[f] || "";
    }

    tr.appendChild(td1);
    tr.appendChild(td2);
    table.appendChild(tr);
  });
}

loadStudent();

// حفظ البيانات
async function saveData(){
  const newParent = document.getElementById("edit_رقم ولي الامر")?.value || "";
  const newLine   = document.getElementById("edit_رقم الخط")?.value || "";
  const newAddr   = document.getElementById("edit_العنوان")?.value || "";
  const newSchool = document.getElementById("edit_المدرسة القادم منها")?.value || "";
  const newNumber = document.getElementById("edit_رقم الطالب")?.value || "";

  const body = new URLSearchParams({
    action: "updateStudent",
    parent: parentNumber,
    code: studentCode,
    newParent,
    newLine,
    newAddress: newAddr,
    newSchoolFrom: newSchool,
    newStudentNumber: newNumber
  });

  const res = await fetch(SHEET_URL, {
    method:"POST",
    headers:{ "Content-Type":"application/x-www-form-urlencoded" },
    body: body.toString()
  });

  const result = await res.json();

  if(result.success){
    alert("✔ تم حفظ التعديلات بنجاح");
  }else{
    alert("⚠ حدث خطأ في الحفظ");
  }
}

// تسجيل الخروج
async function logout(){
  const body = new URLSearchParams({
    action:"logout",
    parent: parentNumber,
    code: studentCode
  });

  await fetch(SHEET_URL, {
    method:"POST",
    headers:{ "Content-Type":"application/x-www-form-urlencoded"},
    body: body.toString()
  });

  localStorage.clear();
  window.location.href = "index.html";
}
</script>

</body>
</html>
