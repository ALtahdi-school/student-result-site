<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التبليغات</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

body{
  font-family:'Cairo',sans-serif;
  direction:rtl;
  margin:0;
  padding:0;
  background:#f5f5f5;
}

.header{
  background:#007bff;
  color:#fff;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.container{
  max-width:700px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.1);
}

.note{
  background:#f0f8ff;
  padding:15px;
  border-radius:10px;
  border:1px solid #d0e7ff;
  margin-bottom:15px;
}

.note-title{
  color:#007bff;
  font-size:18px;
  font-weight:bold;
  margin-bottom:6px;
}

.note-date{
  color:#555;
  font-size:13px;
  margin-bottom:8px;
}

.note-text{
  font-size:15px;
  color:#333;
}

.logout-btn{
  margin-top:20px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#dc3545;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.logout-btn:hover{
  background:#c82333;
}
</style>
</head>
<body>

<div class="header">🔔 التبليغات</div>

<div class="container" id="notifBox">
  ⏳ جاري تحميل التبليغات...
</div>

<button class="logout-btn" onclick="logout()">تسجيل الخروج</button>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwimKjV1uHCxq1DLUQ_hJguMjB4Xi6hw9OGxrlMWheHGhNRzCDLySvnIFBX9-2bQCXo/exec";

function normalize(v){
  v = String(v||"").trim();
  v = v.replace(/\s+/g,"");
  if (v.startsWith("0")) v = v.substring(1);
  return v;
}

async function loadNotifications(){
  const rawParent = localStorage.getItem("parentNumber");
  const rawCode   = localStorage.getItem("studentCode");

  const box = document.getElementById("notifBox");

  if(!rawParent || !rawCode){
    box.textContent = "⛔ انتهت الجلسة، سيتم تحويلك...";
    setTimeout(()=>{ window.location.href="index.html"; },1200);
    return;
  }

  const parent = normalize(rawParent);
  const code   = normalize(rawCode);

  const body = new URLSearchParams({
    action:"getNotifications",
    parent:parent,
    code:code
  });

  try{
    const res = await fetch(SHEET_URL,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:body.toString()
    });

    const data = await res.json();
    console.log("NOTIFICATIONS:", data);

    if(!data.success){
      box.textContent = "لا توجد تبليغات.";
      return;
    }

    const notes = data.notifications || [];
    let html = "";

    notes.forEach(n=>{
      html += `
        <div class="note">
          <div class="note-title">${n.title || "تبليغ"}</div>
          <div class="note-date">${n.date || ""}</div>
          <div class="note-text">${n.text || ""}</div>
        </div>
      `;
    });

    box.innerHTML = html || "لا توجد تبليغات حالياً.";

  }catch(err){
    box.innerHTML = "⚠️ خطأ أثناء تحميل البيانات.";
  }
}

function logout(){
  localStorage.clear();
  window.location.href="index.html";
}

window.onload = loadNotifications;
</script>

</body>
</html>
