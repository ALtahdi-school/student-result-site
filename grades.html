<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درجات الطالب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Cairo', sans-serif;
  direction:rtl;
  background:#f5f6fa;
  padding-bottom:80px;
}

.container {
  max-width:900px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 6px 20px rgba(0,0,0,0.1);
}

h2 {
  text-align:center;
  margin:0 0 20px 0;
  color:#333;
}

.subject-card{
  background:#f0f4ff;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border-right:6px solid #4e73df;
}

.subject-card-title{
  font-weight:bold;
  margin-bottom:6px;
}

button{
  padding:10px 20px;
  background:#007bff;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
  margin-top:10px;
}
button:hover{
  background:#0069d9;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0; right:0;
  height:60px;
  background:#fff;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #ccc;
}

.bottom-nav a{
  text-decoration:none;
  color:#666;
  font-size:13px;
  font-weight:bold;
}
.bottom-nav a.active{
  color:#007bff;
}

.grade-row{
  display:flex;
  justify-content:space-between;
  padding:3px 0;
}

.hr-line{
  border-top:1px solid #ddd;
  margin:10px 0;
}
</style>
</head>

<body>

<div class="container">
  <h2>درجات الطالب</h2>

  <div id="studentHeader" style="padding:10px; background:#eef2ff; border-radius:10px; margin-bottom:15px;">
    جاري تحميل بيانات الطالب...
  </div>

  <div id="gradesArea">
    جاري تحميل الدرجات...
  </div>

  <button onclick="downloadPDF()">📄 تحميل درجات الطالب PDF</button>
</div>

<!-- NAVIGATION -->
<nav class="bottom-nav">
  <a href="account.html">الحساب</a>
  <a href="grades.html" class="active">الدرجات</a>
  <a href="chat.html">الدردشة</a>
  <a href="notifications.html">التبليغات</a>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const SHEET_URL = "YOUR_SCRIPT_URL_HERE"; // ضع رابط السكربت

const parentNumber = localStorage.getItem("parentNumber");
const studentCode  = localStorage.getItem("studentCode");

if(!parentNumber || !studentCode){
  window.location.href = "index.html";
}

let STUDENT = null;

// تحميل البيانات
async function loadGrades(){
  const res = await fetch(`${SHEET_URL}?action=getStudent&parent=${parentNumber}&code=${studentCode}`);
  const data = await res.json();

  if(!data.student){
    document.getElementById("gradesArea").innerHTML = "⚠️ لم يتم العثور على بيانات";
    return;
  }

  STUDENT = data.student;

  // عرض بيانات الطالب أعلى الصفحة
  const header = `
    <strong>ID:</strong> ${STUDENT["id"] || "-"}<br>
    <strong>اسم الطالب:</strong> ${STUDENT["اسم الطالب"] || "-"}<br>
    <strong>الصف:</strong> ${STUDENT["الصف"] || "-"}<br>
    <strong>القاعة:</strong> ${STUDENT["القاعة"] || "-"}<br>
    <strong>الجنس:</strong> ${STUDENT["الجنس"] || "-"}<br>
    <strong>الغياب:</strong> ${STUDENT["الغياب"] || "-"}<br>
    <strong>اختلاق مشاكل:</strong> ${STUDENT["اختلاق مشاكل داخل المدرسة"] || "-"}<br>
    <strong>ملاحظات الكرت:</strong> ${STUDENT["ملاحظات كرت"] || "-"}<br>
    <strong>ملاحظات النتيجة:</strong> ${STUDENT["ملاحظات النتيجة"] || "-"}
  `;
  document.getElementById("studentHeader").innerHTML = header;

  // عرض الدرجات
  const subjects = extractSubjects(STUDENT);
  let html = "";

  subjects.forEach(sub=>{
    html += `
      <div class="subject-card">
        <div class="subject-card-title">${sub.name}</div>
        ${sub.rows.map(r=>`<div class="grade-row"><span>${r.label}</span><span>${r.value}</span></div>`).join("")}
      </div>
    `;
  });

  document.getElementById("gradesArea").innerHTML = html;
}

// استخراج الدرجات حسب المواد
function extractSubjects(st){
  const mapping = {
    "اسلامية": ["اسلامية شهر 1","اسلامية شهر 2","اسلامية فصل 1","اسلامية نصف سنة","اسلامية شهر 3","اسلامية شهر 4","اسلامية فصل 2","اسلامية الامتحان النهائي","اسلامية السعي","اسلامية التقدير"],
    "العربي": ["العربي شهر 1","العربي شهر 2","العربي فصل 1","العربي نصف سنة","العربي شهر 3","العربي شهر 4","العربي فصل 2","العربي الامتحان النهائي","العربي السعي","العربي التقدير"],
    "الانكليزي": ["الانكليزي شهر 1","الانكليزي شهر 2","الانكليزي فصل 1","الانكليزي نصف سنة","الانكليزي شهر 3","الانكليزي شهر 4","الانكليزي فصل 2","الانكليزي الامتحان النهائي","الانكليزي السعي","الانكليزي التقدير"],
    "الرياضيات": ["الرياضيات شهر 1","الرياضيات شهر 2","الرياضيات فصل 1","الرياضيات نصف سنة","الرياضيات شهر 3","الرياضيات شهر 4","الرياضيات فصل 2","الرياضيات الامتحان النهائي","الرياضيات السعي","الرياضيات التقدير"],
    "الكيمياء": ["الكيمياء شهر 1","الكيمياء شهر 2","الكيمياء فصل 1","الكيمياء نصف سنة","الكيمياء شهر 3","الكيمياء شهر 4","الكيمياء فصل 2","الكيمياء الامتحان النهائي","الكيمياء السعي","الكيمياء التقدير"],
    "الفيزياء": ["الفيزياء شهر 1","الفيزياء شهر 2","الفيزياء فصل 1","الفيزياء نصف سنة","الفيزياء شهر 3","الفيزياء شهر 4","الفيزياء فصل 2","الفيزياء الامتحان النهائي","الفيزياء السعي","الفيزياء التقدير"],
    "الاحياء": ["الاحياء شهر 1","الاحياء شهر 2","الاحياء فصل 1","الاحياء نصف سنة","الاحياء شهر 3","الاحياء شهر 4","الاحياء فصل 2","الاحياء الامتحان النهائي","الاحياء السعي","الاحياء التقدير"],
    "الاجتماعيات": ["الاجتماعيات شهر 1","الاجتماعيات شهر 2","الاجتماعيات فصل 1","الاجتماعيات نصف سنة","الاجتماعيات شهر 3","الاجتماعيات شهر 4","الاجتماعيات فصل 2","الاجتماعيات الامتحان النهائي","الاجتماعيات السعي","الاجتماعيات التقدير"],
    "الحاسوب": ["الحاسوب شهر 1","الحاسوب شهر 2","الحاسوب فصل 1","الحاسوب نصف سنة","الحاسوب شهر 3","الحاسوب شهر 4","الحاسوب فصل 2","الحاسوب الامتحان النهائي","الحاسوب السعي","الحاسوب التقدير"],
    "رياضة": ["رياضة شهر 1","رياضة شهر 2","رياضة فصل 1","رياضة نصف سنة","رياضة شهر 3","رياضة شهر 4","رياضة فصل 2","رياضة الامتحان النهائي","رياضة السعي","رياضة التقدير"],
    "الفنية": ["الفنية شهر 1","الفنية شهر 2","الفنية فصل 1","الفنية نصف سنة","الفنية شهر 3","الفنية شهر 4","الفنية فصل 2","الفنية الامتحان النهائي","الفنية السعي","الفنية التقدير"],
    "السلوك": ["السلوك شهر 1","السلوك شهر 2","السلوك فصل 1","السلوك نصف سنة","السلوك شهر 3","السلوك شهر 4","السلوك فصل 2","السلوك الامتحان النهائي","السلوك السعي","السلوك التقدير"]
  };

  const subjects = [];

  for(const subject in mapping){
    subjects.push({
      name: subject,
      rows: mapping[subject].map(label=>({
        label: label,
        value: st[label] || "-"
      }))
    });
  }

  return subjects;
}

// ================== PDF DOWNLOAD ==================
async function downloadPDF(){
  if(!STUDENT){ alert("لم يتم تحميل البيانات بعد"); return; }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: "pt", format: "a4" });

  let y = 40;
  const isMale = (STUDENT["الجنس"] === "ذكر");

  const color = isMale ? "#3b82f6" : "#ec4899";

  pdf.setFont("Helvetica", "bold");
  pdf.setFontSize(20);
  pdf.setTextColor(color);
  pdf.text("ثانوية التحدي – قسم الحوكمة", 160, y);
  y += 30;

  pdf.setFontSize(14);
  pdf.setTextColor("#000");

  pdf.text(`اسم الطالب: ${STUDENT["اسم الطالب"]}`, 40, y); y+=20;
  pdf.text(`ID: ${STUDENT["id"]}`, 40, y); y+=20;
  pdf.text(`الصف: ${STUDENT["الصف"]}   القاعة: ${STUDENT["القاعة"]}`, 40, y); y+=20;
  pdf.text(`الجنس: ${STUDENT["الجنس"]}`, 40, y); y+=20;
  pdf.text(`الغياب: ${STUDENT["الغياب"] || "-"}`, 40, y); y+=20;
  pdf.text(`ملاحظات النتيجة: ${STUDENT["ملاحظات النتيجة"] || "-"}`, 40, y);
  y+=30;

  pdf.setFontSize(16);
  pdf.setTextColor(color);
  pdf.text("درجات الطالب", 240, y);
  y+=20;

  pdf.setTextColor("#000");
  pdf.setFontSize(12);

  const subjects = extractSubjects(STUDENT);

  subjects.forEach(sub=>{
    pdf.setFont("Helvetica", "bold");
    pdf.setTextColor(color);
    pdf.text(sub.name, 40, y);
    y+=15;

    pdf.setFont("Helvetica", "normal");
    pdf.setTextColor("#000");

    sub.rows.forEach(r=>{
      pdf.text(`${r.label}: ${r.value}`, 60, y);
      y+=14;
    });

    y+=10;
    if(y > 750){
      pdf.addPage();
      y = 40;
    }
  });

  // ختم المدرسة
  y += 20;
  pdf.setFontSize(12);
  pdf.setTextColor("#333");
  pdf.text("مدير ثانوية التحدي", 40, y);
  y+=20;
  pdf.text("بلال عبد القادر", 40, y);

  pdf.save(`درجات_${STUDENT["اسم الطالب"]}.pdf`);
}

// تحميل الصفحة
loadGrades();
</script>

</body>
</html>
