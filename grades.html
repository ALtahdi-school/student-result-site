<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درجات الطالب</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

body{
  font-family:'Cairo',sans-serif;
  direction:rtl;
  margin:0;
  padding:0;
  background:#f6f6f6;
}

.header{
  background:#007bff;
  color:#fff;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 25px rgba(0,0,0,0.1);
}

.subject-box{
  background:#f3f3f3;
  padding:15px;
  margin-bottom:20px;
  border-radius:10px;
  border:1px solid #ddd;
}

.subject-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
  color:#007bff;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:8px;
  border:1px solid #ccc;
  text-align:center;
  font-size:14px;
}

th{
  background:#007bff;
  color:#fff;
}

.logout-btn{
  background:#dc3545;
  color:#fff;
  padding:12px;
  border:none;
  border-radius:8px;
  font-size:16px;
  margin-top:25px;
  cursor:pointer;
  width:100%;
}

.logout-btn:hover{
  background:#b4212c;
}
</style>
</head>
<body>

<div class="header">📘 درجات الطالب</div>

<div class="container" id="gradesContainer">
  ⏳ جاري تحميل البيانات...
</div>

<button class="logout-btn" onclick="logout()">تسجيل الخروج</button>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwimKjV1uHCxq1DLUQ_hJguMjB4Xi6hw9OGxrlMWheHGhNRzCDLySvnIFBX9-2bQCXo/exec";

function normalize(v){
  v = String(v||"").trim();
  v = v.replace(/\s+/g,"");
  if(v.startsWith("0")) v = v.substring(1);
  return v;
}

async function loadGrades(){
  const rawParent = localStorage.getItem("parentNumber");
  const rawCode   = localStorage.getItem("studentCode");

  const container = document.getElementById("gradesContainer");

  if(!rawParent || !rawCode){
    container.textContent = "⛔ انتهت الجلسة. سيتم تحويلك...";
    setTimeout(()=>{ window.location.href="index.html"; },1200);
    return;
  }

  const parent = normalize(rawParent);
  const code   = normalize(rawCode);

  const body = new URLSearchParams({
    action: "getStudent",
    parent: parent,
    code: code
  });

  try{
    const res  = await fetch(SHEET_URL,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:body.toString()
    });

    const data = await res.json();

    if(!data.student){
      container.textContent = "⛔ لا يمكن التحقق من الحساب، سيتم تحويلك...";
      setTimeout(()=>{ window.location.href="index.html"; },1500);
      return;
    }

    const student = data.student;

    // 🔥 المواد ودرجاتها
    const subjects = {
      "الاسلامية":       ["شهر 1","شهر 2","فصل 1","نصف سنة","شهر 3","شهر 4","فصل 2","الامتحان النهائي","السعي","التقدير"],
      "عربي":            ["شهر 1","شهر 2","فصل 1","نصف سنة","شهر 3","شهر 4","فصل 2","الامتحان النهائي","السعي","التقدير"],
      "الانكليزي":       ["شهر 1","شهر 2","فصل 1","نصف سنة","شهر 3","شهر 4","فصل 2","الامتحان النهائي","السعي","التقدير"],
      "الرياضيات":       ["شهر 1","شهر 2","فصل 1","نصف سنة","شهر 3","شهر 4","فصل 2","الامتحان النهائي","السعي","التقدير"],
      "الكيمياء":        ["شهر 1","شهر 2","فصل 1","نصف سنة","شهر 3","شهر 4","فصل 2","الامتحان النهائي","السعي","التقدير"],
      "الفيزياء":        ["شهر 1","شهر 2","فصل 1","نصف سنة","شهر 3","شهر 4","فصل 2","الامتحان النهائي","السعي","التقدير"],
      "الاحياء":         ["شهر 1","شهر 2","فصل 1","نصف سنة","شهر 3","شهر 4","فصل 2","الامتحان النهائي","السعي","التقدير"],
      "اجتماعيات":       ["شهر 1","شهر 2","فصل 1","نصف سنة","شهر 3","شهر 4","فصل 2","الامتحان النهائي","السعي","التقدير"],
      "حاسوب":           ["شهر 1","شهر 2","فصل 1","نصف سنة","شهر 3","شهر 4","فصل 2","الامتحان النهائي","السعي","التقدير"],
      "رياضة":           ["شهر 1","شهر 2","فصل 1","نصف سنة","شهر 3","شهر 4","فصل 2","الامتحان النهائي","السعي","التقدير"],
      "فنية":            ["شهر 1","شهر 2","فصل 1","نصف سنة","شهر 3","شهر 4","فصل 2","الامتحان النهائي","السعي","التقدير"]
    };

    let html = "";

    for (let subject in subjects){

      html += `
      <div class="subject-box">
        <div class="subject-title">${subject}</div>
        <table>
          <tr>
      `;

      // عنوان الأعمدة
      subjects[subject].forEach(col=>{
        html += `<th>${col}</th>`;
      });

      html += `</tr><tr>`;

      // القيم
      subjects[subject].forEach(col=>{
        const key = `${subject} ${col}`; // الاسم في الشيت يجب أن يكون بهذا الشكل
        html += `<td>${student[key] || ""}</td>`;
      });

      html += `
          </tr>
        </table>
      </div>
      `;
    }

    container.innerHTML = html;

  }catch(err){
    container.innerHTML = "⚠️ خطأ أثناء تحميل البيانات.";
  }
}

function logout(){
  localStorage.clear();
  window.location.href="index.html";
}

window.onload = loadGrades;
</script>

</body>
</html>
